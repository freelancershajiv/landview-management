name: Patch client WhatsApp finance menu

on:
  push:
    branches:
      - feature/client-whatsapp-finance-menu
    paths:
      - scripts/patch-client-whatsapp-finance-menu.mjs
      - .github/workflows/patch-client-whatsapp-finance-menu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-whatsapp-finance-menu
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-client-whatsapp-finance-menu.mjs
      - name: Check WhatsApp service syntax
        run: node --check whatsapp-service/server.mjs
      - name: Commit patched service
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "landview-ci"
          git config user.email "actions@users.noreply.github.com"
          git add whatsapp-service/server.mjs
          git commit -m "Add client WhatsApp billing self-service [finance-menu-applied]"
          git push origin HEAD:feature/client-whatsapp-finance-menu
