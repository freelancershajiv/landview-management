name: Central Admin and EMP-0002 WhatsApp
on:
  push:
    branches: [feature/admin-emp0002-central-whatsapp]
permissions:
  contents: write
jobs:
  patch-build:
    if: github.event.head_commit.message != 'Apply centralized Admin EMP-0002 WhatsApp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified centralized WhatsApp patch
        shell: bash
        run: |
          curl -fsSL 'https://sb-1ute7ctsuhlu.vercel.run/admin-emp0002-central-whatsapp.patch' -o /tmp/admin-emp0002-central-whatsapp.patch
          echo 'feac271c0b113e35be9c8681a2233b63597a6b2b3356bb4d8439a8619a180a4e  /tmp/admin-emp0002-central-whatsapp.patch' | sha256sum -c -
          git apply /tmp/admin-emp0002-central-whatsapp.patch
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify WhatsApp service
        run: npm --prefix whatsapp-service run check
      - name: Build application
        run: npm run build
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'LAND VIEW CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/admin/whatsapp/page.tsx app/api/admin/role-switch/route.ts app/api/landview-hybrid/route.ts app/api/landview/route.ts app/api/login-fast/route.ts app/api/session-fast/route.ts components/management-shell-v2.tsx components/role-portal-shell.tsx lib/api.ts lib/local-session.ts lib/server-auth.ts whatsapp-service/gateway.mjs whatsapp-service/server.mjs
          git commit -m 'Apply centralized Admin EMP-0002 WhatsApp'
          git push origin HEAD:${{ github.ref_name }}
