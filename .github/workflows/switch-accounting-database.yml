name: Switch LAND VIEW accounting database

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch-accounting-database.yml
      - scripts/patch_accounting_database_id.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch accounting workbook references
        run: python3 scripts/patch_accounting_database_id.py
      - name: Publish switched files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          allowed = {
              "FinanceLedger.gs",
              "ZZ_AccountingFinance.gs",
              "app/admin/accounts/page.tsx",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          files = sorted(changed & allowed)
          if not files:
              print("Accounting references already point to the clean database")
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "land-view-accounting-switch",
          }
          for path in files:
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              with urllib.request.urlopen(urllib.request.Request(url + "?ref=main", headers=headers), timeout=30) as response:
                  current = json.load(response)
              payload = {
                  "message": "Point LAND VIEW accounts to clean rebuilt database",
                  "content": base64.b64encode(open(path, "rb").read()).decode("ascii"),
                  "branch": "main",
                  "sha": current["sha"],
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              print(path, result.get("commit", {}).get("sha", ""))
          PY
