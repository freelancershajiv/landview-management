name: Finance V2 Branch Integrator

"on":
  push:
    branches: [finance-integrity-v2-core]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-integrity-v2-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Finance V2 integration
        run: echo '' | base64 -d > /tmp/finance-v2-integrate.py && python3 /tmp/finance-v2-integrate.py
      - name: Install dependencies
        run: npm ci
      - name: Run Finance V2 tests
        run: node --test tests/project-finance-core.test.cjs tests/project-finance-v2-integration.test.cjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/project-management/route.ts app/projectmanagement/page.tsx tests/project-finance-core.test.cjs tests/project-finance-v2-integration.test.cjs
          git diff --cached --check
          git commit -m "feat: use finance v2 for project current balance"
          git push origin HEAD:finance-integrity-v2-core
