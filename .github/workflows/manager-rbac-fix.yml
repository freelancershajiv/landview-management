name: Manager RBAC fix
on:
  push:
    branches: [fix/manager-role-policy]
permissions:
  contents: write
jobs:
  patch-build:
    if: github.event.head_commit.message != 'Apply Manager role policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Manager role policy
        run: python .github/manager_patch.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "LAND VIEW CI"
          git config user.email "actions@users.noreply.github.com"
          git add app components lib
          git commit -m "Apply Manager role policy"
          git push origin HEAD:fix/manager-role-policy
