name: Temporary security audit fix

on:
  push:
    branches:
      - fix/ledger-security-20260916
    paths:
      - .github/workflows/temp-security-audit.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ledger-security-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile security fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh transitive dependencies for security fixes"
            git push origin HEAD:fix/ledger-security-20260916
          fi
      - run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Full dependency audit
        run: npm audit
