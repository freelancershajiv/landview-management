name: Apply project status billing filters

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_project_billing_status_filters.py
      - .github/workflows/patch-project-billing-status-filters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project status and billing eligibility patch
        run: python3 scripts/patch_project_billing_status_filters.py

      - name: Commit patched application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/projects/page.tsx 'app/admin/projects/[projectId]/page.tsx' app/admin/finance/page.tsx
          if git diff --cached --quiet; then
            echo "Project status billing filters are already applied."
            exit 0
          fi
          git commit -m "Filter billing by project status and receivables"
          git push
