name: Fix JPG Chrome renderer

on:
  push:
    paths:
      - ".jpg-renderer-fix-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install safe DOM rasterizer
        run: npm install html2canvas@1.4.1 --save-exact
      - name: Replace SVG foreignObject renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/save-document-jpg.ts')
          text = path.read_text()

          if 'import html2canvas from "html2canvas";' not in text:
              text = text.replace(
                  'import type { SheetInvoices } from "@/lib/sheet-invoices";\n',
                  'import type { SheetInvoices } from "@/lib/sheet-invoices";\nimport html2canvas from "html2canvas";\n',
                  1,
              )

          text, removed = re.subn(
              r'function loadSvgImage\(blob: Blob\) \{.*?\n\}\n\n(?=function canvasToJpeg)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1 and 'function loadSvgImage' in text:
              raise SystemExit('Could not remove the foreignObject SVG loader')

          replacement = '''async function renderPageToJpeg(page: HTMLElement) {
            const rect = page.getBoundingClientRect();
            const width = Math.max(1, Math.round(rect.width));
            const height = Math.max(1, Math.round(rect.height));
            const scale = Math.min(3, Math.max(2, window.devicePixelRatio || 1));

            // The page lives only inside the off-screen JPG export host, so it is
            // safe to sanitize it in place. Embedding all <img> resources and
            // inlining URL-free computed styles keeps html2canvas origin-clean.
            inlineComputedStyles(page, page);
            await embedImages(page, page);
            stripNetworkReferences(page);
            await waitForFrame();

            const canvas = await html2canvas(page, {
              backgroundColor: "#ffffff",
              scale,
              useCORS: false,
              allowTaint: false,
              foreignObjectRendering: false,
              logging: false,
              width,
              height,
              windowWidth: width,
              windowHeight: height,
              scrollX: 0,
              scrollY: 0,
              imageTimeout: 5000,
            });

            return canvasToJpeg(canvas);
          }'''

          text, changed = re.subn(
              r'async function renderPageToJpeg\(page: HTMLElement\) \{.*?\n\}\n\n(?=function downloadBlob)',
              replacement + '\n\n',
              text,
              count=1,
              flags=re.S,
          )
          if changed != 1:
              raise SystemExit('Could not replace renderPageToJpeg')

          text = text.replace(
              'root.querySelectorAll<HTMLElement>("*").forEach((element) => {',
              '[root, ...Array.from(root.querySelectorAll<HTMLElement>("*"))].forEach((element) => {',
              1,
          )

          path.write_text(text)
          PY
      - name: Verify production build
        run: npm run build
      - name: Chromium JPG smoke test
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js /tmp/html2canvas.min.js
          cat > /tmp/jpg-smoke.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>JPG_PENDING</title></head>
          <body style="margin:0;background:#eee">
            <div id="page" style="width:794px;height:1123px;background:#fff;padding:40px;box-sizing:border-box;font-family:Arial,sans-serif;color:#111">
              <h1>LAND VIEW JPG smoke test</h1>
              <img alt="pixel" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" style="width:10px;height:10px">
              <table style="width:100%;border-collapse:collapse"><tr><td style="border:1px solid #222;padding:8px">Billing</td><td style="border:1px solid #222;padding:8px">Proposal</td></tr></table>
            </div>
            <div id="status">JPG_PENDING</div>
            <script src="./html2canvas.min.js"></script>
            <script>
              (async () => {
                const status = document.getElementById('status');
                try {
                  const canvas = await html2canvas(document.getElementById('page'), {
                    backgroundColor: '#ffffff', scale: 2, useCORS: false,
                    allowTaint: false, foreignObjectRendering: false, logging: false
                  });
                  await new Promise((resolve, reject) => {
                    try {
                      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('null blob')), 'image/jpeg', 0.96);
                    } catch (error) { reject(error); }
                  });
                  status.textContent = 'JPG_OK';
                  document.title = 'JPG_OK';
                } catch (error) {
                  status.textContent = 'JPG_FAIL:' + (error && error.message ? error.message : String(error));
                  document.title = 'JPG_FAIL';
                }
              })();
            </script>
          </body></html>
          EOF
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium browser found on runner"
            exit 1
          fi
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom file:///tmp/jpg-smoke.html > /tmp/jpg-smoke.out 2>/tmp/jpg-smoke.err || {
            cat /tmp/jpg-smoke.err
            exit 1
          }
          cat /tmp/jpg-smoke.out
          grep -q 'JPG_OK' /tmp/jpg-smoke.out
      - name: Commit safe JPG renderer
        run: |
          if git diff --quiet -- lib/save-document-jpg.ts package.json package-lock.json; then
            echo "No JPG renderer changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/save-document-jpg.ts package.json package-lock.json
          git commit -m "Use origin-clean renderer for JPG export"
          git push origin main
