name: Client WhatsApp project updates
on:
  push:
    branches: [feature/client-whatsapp-project-updates]
permissions:
  contents: write
jobs:
  patch-build:
    if: github.event.head_commit.message != 'Apply client WhatsApp project updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified client WhatsApp patch
        shell: bash
        run: |
          curl -fsSL 'https://sb-5bx4upaew8tz.vercel.run/client-wa-verify-7f31.patch' -o /tmp/client-wa.patch
          echo '1d51d7de47ef1c8c0fb0f95dfe6631c47b29117bb74eeae6db1b7bfc8e146856  /tmp/client-wa.patch' | sha256sum -c -
          git apply /tmp/client-wa.patch
      - name: Verify diff
        run: git diff --check
      - name: Install application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Verify WhatsApp service
        run: |
          cd whatsapp-service
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'LAND VIEW CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/admin/projects/'[projectId]'/page.tsx \
                  app/admin/projects/legacy/page.tsx \
                  app/admin/projects/new/page.tsx \
                  app/admin/projects/page.tsx \
                  app/admin/workflow/page.tsx \
                  app/api/admin/whatsapp/client/route.ts \
                  components/whatsapp-number-check.tsx \
                  lib/client-project-whatsapp.ts \
                  whatsapp-service/server.mjs
          git commit -m 'Apply client WhatsApp project updates'
          git push origin HEAD:${{ github.ref_name }}
