name: Invoice Integrity Regression

on:
  pull_request:
    paths:
      - "app/api/billing/integrity/**"
      - "app/api/billing/invoice-center/**"
      - "app/api/billing/allocation-corrections/**"
      - "app/api/billing/reminders/**"
      - "app/api/cron/invoice-reminders/**"
      - "app/api/billing-document-history/**"
      - "app/admin/finance/invoice-center/**"
      - "app/admin/finance/allocation-corrections/**"
      - "app/admin/finance/integrity/**"
      - "app/admin/finance/invoices/page.tsx"
      - "lib/invoice-correction-policy.ts"
      - "lib/invoice-center.ts"
      - "lib/invoice-reminders.ts"
      - "lib/sheet-invoices.ts"
      - "tests/invoice-*.test.cjs"
      - "tests/billing-v4-reliability.test.cjs"
      - "tests/billing-reconciliation-41.test.cjs"
      - "tests/billing-full-editor-v42.test.cjs"
      - "tests/billing-project-statement-v43.test.cjs"
      - "tests/billing-reports-v44.test.cjs"
      - "lib/billing-reports-v44.ts"
      - "lib/billing-reports-v44-server.ts"
      - "app/api/billing/reports-v44/**"
      - "app/admin/finance/reports/**"
      - "lib/project-statement-v43.ts"
      - "lib/project-statement-document-v43.ts"
      - "lib/project-statement-pdf-v43.ts"
      - "app/api/billing/project-statement/**"
      - "app/api/billing/project-statement-print/**"
      - "app/api/billing/project-receipts/route.ts"
      - "app/admin/finance/project-statement/**"
      - "components/project-receipt-history.tsx"
      - "app/api/billing/full-revision-v42/**"
      - "app/admin/finance/full-bill-editor/**"
      - "supabase/migrations/*billing_v42*"
      - "supabase/functions/landview-data/index.ts"
      - "lib/billing-reconciliation-41.ts"
      - "app/api/billing/reconciliation-41/**"
      - "app/admin/finance/reconciliation/**"
      - "app/api/billing/batch/**"
      - "app/api/billing/submission-status/**"
      - "app/admin/finance/page.tsx"
      - "components/billing-navigation.tsx"
      - "components/billing-project-jump.tsx"
      - "next.config.ts"
      - "tests/proposal-billing-conversion.test.cjs"
      - ".github/workflows/invoice-integrity-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Invoice regression tests
        run: |
          node --test \
            tests/invoice-correction-policy.test.cjs \
            tests/invoice-corrections-32.test.cjs \
            tests/invoice-allocation-assessment.test.cjs \
            tests/invoice-reconciliation-31.test.cjs \
            tests/invoice-discount-visibility.test.cjs \
            tests/invoice-bill-identity.test.cjs \
            tests/invoice-integrity-api.test.cjs \
            tests/billing-document-integrity.test.cjs \
            tests/invoice-single-bill-status.test.cjs \
            tests/proposal-billing-conversion.test.cjs \
            tests/invoice-center.test.cjs
      - name: Billing 4.4 management reports regression gate
        run: node --test tests/billing-reports-v44.test.cjs

      - name: Billing 4.4 reports scoped lint
        run: npx eslint lib/billing-reports-v44.ts lib/billing-reports-v44-server.ts app/api/billing/reports-v44/route.ts app/api/billing/reports-v44/print/route.ts app/admin/finance/reports/page.tsx

      - name: Billing 4.3 project statements and receipt integrity gate
        run: node --test tests/billing-project-statement-v43.test.cjs
      - name: Billing 4.3 statement and receipt scoped lint
        run: npx eslint lib/project-statement-v43.ts lib/project-statement-document-v43.ts lib/project-statement-pdf-v43.ts app/api/billing/project-statement/route.ts app/api/billing/project-statement-print/route.ts app/admin/finance/project-statement/page.tsx app/api/billing/project-receipts/route.ts components/project-receipt-history.tsx

      - name: Billing 4.2 atomic editor integrity gate
        run: node --test tests/billing-full-editor-v42.test.cjs

      - name: Billing 4.2 scoped lint
        run: npx eslint app/api/billing/full-revision-v42/route.ts app/admin/finance/full-bill-editor/page.tsx

      - name: Billing 4.1 reconciliation review gate
        run: node --test tests/billing-reconciliation-41.test.cjs
      - name: Billing 4.1 scoped lint
        run: npx eslint lib/billing-reconciliation-41.ts app/api/billing/reconciliation-41/route.ts app/admin/finance/reconciliation/page.tsx

      - name: Billing V4 reliability tests
        run: node --test tests/billing-v4-reliability.test.cjs
      - name: Billing V4 route/server lint
        run: npx eslint app/api/billing/batch/route.ts app/api/billing/submission-status/route.ts components/billing-navigation.tsx components/billing-project-jump.tsx

      - name: Lint new invoice correction modules
        run: npx eslint lib/invoice-correction-policy.ts app/api/billing/allocation-corrections/route.ts app/admin/finance/allocation-corrections/page.tsx
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Legacy full test suite (report only)
        continue-on-error: true
        run: npm test
