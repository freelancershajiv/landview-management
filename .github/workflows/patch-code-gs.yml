name: Patch chairman identity and September approvals

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-code-gs.yml
      - scripts/patch_chairman_approval.py
      - scripts/patch_emp0001_login.py
      - scripts/patch_backend_retry.py
      - ChairmanPendingExpenses.gs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch EMP-0001 identity and approval UI
        run: python3 scripts/patch_chairman_approval.py
      - name: Patch EMP-0001 login alias
        run: python3 scripts/patch_emp0001_login.py
      - name: Patch Apps Script proxy retries
        run: python3 scripts/patch_backend_retry.py
      - name: Commit patched application files
        run: |
          if git diff --quiet -- Code.gs app/api/landview/route.ts components/chairman-expense-approval.tsx components/employee-portal-shell.tsx; then
            echo "No application changes required"
            exit 0
          fi
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs app/api/landview/route.ts components/chairman-expense-approval.tsx components/employee-portal-shell.tsx
          git commit -m "Harden EMP-0001 login backend retries"
          git push origin HEAD:main
