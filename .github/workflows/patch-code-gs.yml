name: Patch Code.gs access controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-code-gs.yml
      - scripts/patch_code_gs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Code.gs
        run: python3 scripts/patch_code_gs.py
      - name: Commit Code.gs
        run: |
          if git diff --quiet -- Code.gs; then
            echo "No Code.gs changes required"
            exit 0
          fi
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs
          git commit -m "Enforce granular permissions and expense approvals in Code.gs"
          git push origin HEAD:main
