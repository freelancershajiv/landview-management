name: Patch LAND VIEW modular Apps Script files

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_accounting_database_id.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply modular finance cutover
        run: python3 scripts/patch_accounting_database_id.py

      - name: Commit patched Apps Script files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FinanceSheet.gs FinanceLedger.gs ZZ_AccountingFinance.gs app/admin/accounts/page.tsx
          if git diff --cached --quiet; then
            echo "No modular cutover changes required."
            exit 0
          fi
          git commit -m "Route finance Apps Script to modular databases"
          git push
