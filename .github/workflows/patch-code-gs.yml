name: Patch secure Code.gs permissions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-code-gs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Code.gs access control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Code.gs')
          s = path.read_text(encoding='utf-8')

          # 1) Expand expense schema with approval/audit fields.
          old = 'headers: ["Expense_ID", "Project_ID", "Expense_Date", "Category", "Description", "Amount", "Payment_Method", "Reference", "Status", "Created_At", "Created_By"]'
          new = 'headers: ["Expense_ID", "Project_ID", "Expense_Date", "Category", "Description", "Amount", "Payment_Method", "Reference", "Status", "Notes", "Reviewed_By", "Reviewed_At", "Review_Notes", "Created_At", "Created_By"]'
          if old not in s:
              raise SystemExit('Expense header block not found')
          s = s.replace(old, new, 1)

          # 2) Add granular permission helpers immediately before ERP record filtering.
          anchor = 'function filterErpRecordsForSession_(moduleName, records, session) {'
          if anchor not in s:
              raise SystemExit('ERP filter anchor not found')

          helpers = r'''function isMainAdminRole_(role) {
  return normalizeRoleName(role) === "admin";
}

const LAND_VIEW_PERMISSION_KEYS = {
  PROJECTS_VIEW: "projects.view",
  PROJECTS_EDIT: "projects.edit",
  WORKFLOW_VIEW: "workflow.view",
  WORKFLOW_EDIT: "workflow.edit",
  WORKFLOW_ASSIGN: "workflow.assign",
  DOCUMENTS_VIEW: "documents.view",
  DOCUMENTS_EDIT: "documents.edit",
  SITE_VIEW: "site.view",
  SITE_EDIT: "site.edit",
  CERTIFICATES_VIEW: "certificates.view",
  CERTIFICATES_PROCESS: "certificates.process",
  CERTIFICATES_ISSUE: "certificates.issue",
  FINANCE_VIEW: "finance.view",
  FINANCE_EDIT: "finance.edit",
  EMPLOYEES_VIEW: "employees.view",
  EMPLOYEES_MANAGE: "employees.manage",
  ATTENDANCE_VIEW: "attendance.view",
  ATTENDANCE_EDIT: "attendance.edit",
  EXPENSES_SUBMIT: "expenses.submit",
  EXPENSES_VIEW_ALL: "expenses.view_all",
  EXPENSES_APPROVE: "expenses.approve",
  PUBLIC_VIEW: "public.view",
  PUBLIC_EDIT: "public.edit",
  REPORTS_VIEW: "reports.view"
};

function permissionPrincipalIds_(session) {
  const ids = [];
  [session && session.userId, session && session.employeeId, session && session.username].forEach(function(value) {
    const id = String(value || "").trim();
    if (id && ids.indexOf(id) < 0) ids.push(id);
  });
  return ids;
}

function latestPermissionState_(session, permissionKey) {
  if (isMainAdminRole_(session && session.role)) return true;
  const principals = permissionPrincipalIds_(session);
  if (!principals.length) return false;
  const key = String(permissionKey || "").trim();
  const rows = readSheet(CONFIG.SHEETS.PERMISSIONS)
    .filter(function(row) {
      const uid = String(firstValue(row, ["User_ID", "User ID", "Employee_ID", "Employee ID"]) || "").trim();
      const permission = String(firstValue(row, ["Permission", "Permission_Key", "Permission Key"]) || "").trim();
      return principals.indexOf(uid) >= 0 && permission === key;
    })
    .sort(function(a, b) {
      const ad = new Date(String(firstValue(a, ["Created_At", "Created At"]) || 0)).getTime() || 0;
      const bd = new Date(String(firstValue(b, ["Created_At", "Created At"]) || 0)).getTime() || 0;
      return ad - bd;
    });
  if (!rows.length) return false;
  return normalize(firstValue(rows[rows.length - 1], ["Status", "status"])) === "active";
}

function hasPermission_(session, permissionKey) {
  return latestPermissionState_(session, permissionKey);
}

function requirePermission_(session, permissionKey, message) {
  if (!hasPermission_(session, permissionKey)) {
    throw new Error(message || ("Permission required: " + permissionKey));
  }
  return true;
}

function ownsExpenseRecord_(row, session) {
  const principals = permissionPrincipalIds_(session);
  const createdBy = String(firstValue(row, ["Created_By", "Created By", "Employee_ID", "Employee ID"]) || "").trim();
  return !!createdBy && principals.indexOf(createdBy) >= 0;
}

function canSeeAllExpenses_(session) {
  return isMainAdminRole_(session.role) ||
    hasPermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_VIEW_ALL) ||
    hasPermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_APPROVE);
}

function enforceErpReadPermission_(moduleName, session) {
  if (isMainAdminRole_(session.role)) return true;
  const role = normalizeRoleName(session.role);

  if (role === "client") {
    if (moduleName === "drawings" || moduleName === "approvals") return true;
    throw new Error("Access denied.");
  }

  if (moduleName === "expenses") {
    if (canSeeAllExpenses_(session) || hasPermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_SUBMIT)) return true;
    throw new Error("You do not have permission to view office expenses.");
  }
  if (moduleName === "tasks") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.WORKFLOW_VIEW);
  if (moduleName === "attendance") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.ATTENDANCE_VIEW);
  if (moduleName === "drawings") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.DOCUMENTS_VIEW);
  if (moduleName === "quotations" || moduleName === "clients") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.FINANCE_VIEW);
  if (moduleName === "approvals") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.CERTIFICATES_VIEW);
  if (moduleName === "leave" && role === "employee") return true;

  throw new Error("Access denied.");
}

function enforceErpCreatePermission_(moduleName, session) {
  if (isMainAdminRole_(session.role)) return true;
  if (moduleName === "expenses") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_SUBMIT, "You do not have permission to submit office expenses.");
  if (moduleName === "tasks") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.WORKFLOW_EDIT);
  if (moduleName === "attendance") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.ATTENDANCE_EDIT);
  if (moduleName === "drawings") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.DOCUMENTS_EDIT);
  if (moduleName === "quotations" || moduleName === "clients") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.FINANCE_EDIT);
  if (moduleName === "leave" && normalizeRoleName(session.role) === "employee") return true;
  throw new Error("Access denied.");
}

function enforceErpUpdatePermission_(moduleName, params, session) {
  if (isMainAdminRole_(session.role)) return true;
  if (moduleName === "expenses") {
    const statusChange = params.Status !== undefined || params.Reviewed_By !== undefined || params.Reviewed_At !== undefined || params.Review_Notes !== undefined;
    if (statusChange) return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_APPROVE, "You do not have permission to approve or reject expenses.");
    return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_SUBMIT);
  }
  if (moduleName === "tasks") {
    if (params.Assigned_Employee_ID !== undefined) return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.WORKFLOW_ASSIGN);
    return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.WORKFLOW_EDIT);
  }
  if (moduleName === "attendance") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.ATTENDANCE_EDIT);
  if (moduleName === "drawings") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.DOCUMENTS_EDIT);
  if (moduleName === "quotations" || moduleName === "clients") return requirePermission_(session, LAND_VIEW_PERMISSION_KEYS.FINANCE_EDIT);
  if (moduleName === "leave" && normalizeRoleName(session.role) === "employee") return true;
  throw new Error("Access denied.");
}

function secureFilterErpRecordsForSession_(moduleName, records, session) {
  const role = normalizeRoleName(session.role);
  if (isMainAdminRole_(role)) return records;

  enforceErpReadPermission_(moduleName, session);

  if (moduleName === "expenses") {
    if (canSeeAllExpenses_(session)) return records;
    return records.filter(function(row) { return ownsExpenseRecord_(row, session); });
  }

  if (role === "employee") {
    const employeeId = String(session.employeeId || "").trim();
    if (moduleName === "tasks" || moduleName === "drawings") {
      return records.filter(function(row) { return String(row.Assigned_Employee_ID || "").trim() === employeeId; });
    }
    if (moduleName === "attendance" || moduleName === "leave") {
      return records.filter(function(row) { return String(row.Employee_ID || "").trim() === employeeId; });
    }
  }

  if (role === "client") {
    const projectIds = splitIds(session.projectIds || "");
    return records.filter(function(row) { return projectIds.indexOf(String(row.Project_ID || "").trim()) >= 0; });
  }

  return records;
}

'''
          if 'function isMainAdminRole_(role)' not in s:
              s = s.replace(anchor, helpers + anchor, 1)

          # 3) Replace legacy ERP read/create/update functions with secure versions.
          pattern = re.compile(r'function filterErpRecordsForSession_\(moduleName, records, session\) \{.*?\n\}\n\nfunction getErpRecords\(params\) \{.*?\n\}\n\nfunction createErpRecord\(params\) \{.*?\n\}\n\nfunction updateErpRecord\(params\) \{.*?\n\}\n', re.S)
          replacement = r'''function filterErpRecordsForSession_(moduleName, records, session) {
  return secureFilterErpRecordsForSession_(moduleName, records, session);
}

function getErpRecords(params) {
  const session = requireSession(params);
  const moduleName = normalizeRoleName(params.module);
  const module = erpModule_(moduleName);
  ensureErpModule_(module);
  const records = readSheet(CONFIG.SHEETS[module.sheet]);
  return { success: true, data: secureFilterErpRecordsForSession_(moduleName, records, session) };
}

function createErpRecord(params) {
  const session = requireSession(params);
  const role = normalizeRoleName(session.role);
  const moduleName = normalizeRoleName(params.module);
  const module = erpModule_(moduleName);
  enforceErpCreatePermission_(moduleName, session);
  ensureErpModule_(module);

  const record = cleanParams(params);
  delete record.module;
  record.Created_At = record.Created_At || new Date().toISOString();
  record.Created_By = session.userId || session.username || "";

  if (moduleName === "expenses" && !isMainAdminRole_(role)) {
    record.Status = "Pending";
    record.Reviewed_By = "";
    record.Reviewed_At = "";
    record.Review_Notes = "";
  }

  if (role === "employee") {
    if (moduleName === "attendance" || moduleName === "leave") record.Employee_ID = session.employeeId || "";
    if (moduleName === "tasks" || moduleName === "drawings") record.Assigned_Employee_ID = session.employeeId || "";
  }

  return appendRecord(CONFIG.SHEETS[module.sheet], record, module.prefix, module.id);
}

function updateErpRecord(params) {
  const session = requireSession(params);
  const role = normalizeRoleName(session.role);
  const moduleName = normalizeRoleName(params.module);
  const module = erpModule_(moduleName);
  ensureErpModule_(module);
  enforceErpUpdatePermission_(moduleName, params, session);

  const allRecords = readSheet(CONFIG.SHEETS[module.sheet]);
  const id = String(params.id || "").trim();
  const target = allRecords.find(function(row) { return String(row[module.id] || "").trim() === id; });
  if (!target) throw new Error("Record not found.");

  if (!isMainAdminRole_(role)) {
    const visible = secureFilterErpRecordsForSession_(moduleName, allRecords, session);
    if (!visible.some(function(row) { return String(row[module.id] || "").trim() === id; })) {
      throw new Error("Record not found or access denied.");
    }
  }

  const changes = cleanParams(params);
  delete changes.module;
  delete changes.id;

  if (moduleName === "expenses" && !isMainAdminRole_(role)) {
    const canApprove = hasPermission_(session, LAND_VIEW_PERMISSION_KEYS.EXPENSES_APPROVE);
    if (canApprove && changes.Status !== undefined) {
      const status = String(changes.Status || "").trim();
      if (["Approved", "Rejected", "Pending"].indexOf(status) < 0) throw new Error("Invalid expense status.");
      const notes = String(changes.Review_Notes || changes.Notes || "").trim();
      Object.keys(changes).forEach(function(key) { delete changes[key]; });
      changes.Status = status;
      changes.Review_Notes = notes;
      changes.Reviewed_By = session.userId || session.username || "";
      changes.Reviewed_At = new Date().toISOString();
    } else {
      if (!ownsExpenseRecord_(target, session)) throw new Error("You can edit only your own expense submissions.");
      if (normalize(target.Status || "pending") !== "pending") throw new Error("Only pending expenses can be edited.");
      const allowedExpenseFields = ["Project_ID", "Expense_Date", "Category", "Description", "Amount", "Payment_Method", "Reference", "Notes"];
      Object.keys(changes).forEach(function(key) { if (allowedExpenseFields.indexOf(key) < 0) delete changes[key]; });
    }
  } else if (role === "employee") {
    const allowedEmployeeFields = ["Status", "Check_In", "Check_Out", "Work_Hours", "Notes", "Drive_URL", "Comments", "Completed_At", "Submitted_At", "Progress"];
    Object.keys(changes).forEach(function(key) { if (allowedEmployeeFields.indexOf(key) < 0) delete changes[key]; });
  } else if (role === "client") {
    const allowedClientFields = ["Status", "Decision_Notes", "Decided_At"];
    Object.keys(changes).forEach(function(key) { if (allowedClientFields.indexOf(key) < 0) delete changes[key]; });
  }

  return updateGeneric(CONFIG.SHEETS[module.sheet], changes, [module.id], id);
}
'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'ERP function block replacement count={count}')

          # 4) Restrict permission administration to the true Admin role and ensure schema.
          perm_pattern = re.compile(r'function getPermissions\(params\) \{.*?\n\}\n\n\nfunction createPermission\(params\) \{.*?\n\}\n', re.S)
          perm_replacement = r'''function ensurePermissionHeaders_() {
  return ensureHeaders_(getSheet(CONFIG.SHEETS.PERMISSIONS), [
    "Permission_ID", "User_ID", "Role", "Permission", "Status", "Created_At", "Created_By"
  ]);
}

function getPermissions(params) {
  const session = requireSession(params);
  if (!isMainAdminRole_(session.role)) throw new Error("Only the Main Admin can manage permissions.");
  ensurePermissionHeaders_();
  return { success: true, data: readSheet(CONFIG.SHEETS.PERMISSIONS) };
}

function createPermission(params) {
  const session = requireSession(params);
  if (!isMainAdminRole_(session.role)) throw new Error("Only the Main Admin can manage permissions.");
  ensurePermissionHeaders_();
  const record = cleanParams(params);
  record.Created_At = record.Created_At || new Date().toISOString();
  record.Created_By = session.userId || session.username || "";
  return appendRecord(CONFIG.SHEETS.PERMISSIONS, record, "PERM-", "Permission_ID");
}
'''
          s, count = perm_pattern.subn(perm_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Permission block replacement count={count}')

          path.write_text(s, encoding='utf-8')
          print('Code.gs patched successfully')
          PY

      - name: Commit patched Code.gs
        shell: bash
        run: |
          if git diff --quiet -- Code.gs; then
            echo "No Code.gs changes required"
            exit 0
          fi
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Code.gs
          git commit -m "Enforce granular permissions and expense approvals in Code.gs"
          git push origin HEAD:main
