name: Admin sidebar editing pass
on:
  push:
    branches: [fix/admin-sidebar-editing-pass]
permissions:
  contents: write
jobs:
  patch-build:
    if: github.event.head_commit.message != 'Apply admin sidebar editing pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply admin UX pass
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('.')

          p=root/'components/management-shell-v2.tsx'
          s=p.read_text()
          start=s.index('type NavItem =')
          end=s.index('const SESSION_WATCHDOG_MS', start)
          new_block='''type NavItem = { href: string; label: string; icon: string; section: string; permission?: string; adminOnly?: boolean };\n\nconst nav: NavItem[] = [\n  { href: "/admin", label: "Dashboard", icon: "⌂", section: "Overview", permission: "dashboard.view" },\n\n  { href: "/admin/projects", label: "Projects", icon: "▣", section: "Projects & Operations", permission: "projects.view" },\n  { href: "/projectmanagement", label: "Project Management", icon: "◈", section: "Projects & Operations", permission: "project_management.view" },\n  { href: "/admin/estimate", label: "Estimates", icon: "▤", section: "Projects & Operations", permission: "estimates.view" },\n  { href: "/admin/workflow", label: "Workflow", icon: "↗", section: "Projects & Operations", permission: "workflow.view" },\n  { href: "/admin/site-visits", label: "Site Visits", icon: "⌖", section: "Projects & Operations", permission: "site.view" },\n\n  { href: "/admin/registers", label: "Document Registry", icon: "▧", section: "People & Records", permission: "documents.view" },\n  { href: "/admin/employees", label: "Employees", icon: "♙", section: "People & Records", permission: "employees.view" },\n  { href: "/admin/certificates", label: "Certificates", icon: "⌑", section: "People & Records", permission: "certificates.view" },\n\n  { href: "/admin/proposals", label: "Proposals", icon: "✎", section: "Finance & Commercial", permission: "proposals.view" },\n  { href: "/admin/finance", label: "Billing", icon: "৳", section: "Finance & Commercial", permission: "finance.view" },\n  { href: "/admin/expenses", label: "Expenses", icon: "◫", section: "Finance & Commercial", permission: "expenses.view_all" },\n  { href: "/admin/accounts/entry", label: "Main Accounts", icon: "▥", section: "Finance & Commercial", adminOnly: true },\n  { href: "/admin/accounts", label: "Ledger", icon: "≡", section: "Finance & Commercial", permission: "ledger.view" },\n\n  { href: "/admin/website-leads", label: "Website Enquiries", icon: "✦", section: "Website & Insights", permission: "public.view" },\n  { href: "/admin/website-analytics", label: "Website Analytics", icon: "⌁", section: "Website & Insights", permission: "analytics.view" },\n\n  { href: "/admin/access", label: "Access Control", icon: "⚿", section: "Administration", adminOnly: true },\n\n  { href: "/admin/projects/new", label: "New Project", icon: "+", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/legacy", label: "Legacy Registration", icon: "◷", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/locations", label: "Project Locations", icon: "⌖", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/missing-serials", label: "Missing Serials", icon: "#", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/payment-routing", label: "Payment Routing", icon: "↔", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/reclassify", label: "Project Reclassify", icon: "⇄", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/website-curation", label: "Website Curation", icon: "✦", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/projects/website-readiness", label: "Website Readiness", icon: "✓", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/finance/bills", label: "Bills Editor", icon: "৳", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/finance/invoices", label: "Invoice Register", icon: "▤", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/accounts/export", label: "Ledger Export", icon: "⇩", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/municipality-accounts", label: "Municipality Accounts", icon: "▦", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/municipality-file-pass", label: "Municipality File Pass", icon: "✓", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/security", label: "Security", icon: "◆", section: "Admin Editing", adminOnly: true },\n  { href: "/admin/whatsapp", label: "WhatsApp", icon: "●", section: "Admin Editing", adminOnly: true },\n];\n'''
          s=s[:start]+new_block+s[end:]
          old='''  const orderedVisibleNav = useMemo(\n    () => navOrder.map((href) => nav.find((item) => item.href === href)).filter((item): item is NavItem => Boolean(item) && visibleNav.some((v) => v.href === item!.href)),\n    [visibleNav]\n  );\n'''
          new='''  const groupedVisibleNav = useMemo(() => {\n    const groups: Array<{ section: string; items: NavItem[] }> = [];\n    for (const item of visibleNav) {\n      const existing = groups.find((group) => group.section === item.section);\n      if (existing) existing.items.push(item);\n      else groups.push({ section: item.section, items: [item] });\n    }\n    return groups;\n  }, [visibleNav]);\n'''
          if old not in s: raise RuntimeError('ordered nav block not found')
          s=s.replace(old,new,1)
          old_markup='''        <div className="primary-nav-inner">\n          <Link href="/admin" aria-current={pathname === "/admin" ? "page" : undefined} className={pathname === "/admin" ? "active dashboard-nav" : "dashboard-nav"} onClick={()=>setMobileOpen(false)}><span className="nav-icon" aria-hidden="true">⌂</span><span>Dashboard</span></Link>\n{orderedVisibleNav.map((item) => {\n  const active = currentMatches(pathname, item.href);\n  return <Link key={item.href} href={item.href} aria-current={active ? "page" : undefined} className={active ? "active" : ""} onClick={() => setMobileOpen(false)}><span className="nav-icon" aria-hidden="true">{item.icon}</span><span>{item.label}</span></Link>;\n})}\n        </div>\n'''
          new_markup='''        <div className="primary-nav-inner">\n          {groupedVisibleNav.map((group) => (\n            <section className={`sidebar-nav-section ${group.section === "Admin Editing" ? "sidebar-admin-editing" : ""}`} key={group.section} aria-label={group.section}>\n              <div className="sidebar-section-label">{group.section}</div>\n              {group.items.map((item) => {\n                const active = currentMatches(pathname, item.href);\n                return <Link key={item.href} href={item.href} aria-current={active ? "page" : undefined} className={active ? "active" : ""} onClick={() => setMobileOpen(false)}><span className="nav-icon" aria-hidden="true">{item.icon}</span><span>{item.label}</span></Link>;\n              })}\n            </section>\n          ))}\n        </div>\n'''
          if old_markup not in s: raise RuntimeError('nav markup not found')
          s=s.replace(old_markup,new_markup,1)
          p.write_text(s)

          p=root/'app/admin/layout.tsx'
          s=p.read_text()
          s=s.replace('import MunicipalityAccountsNavLink from "@/components/municipality-accounts-nav-link";\n','')
          s=s.replace('    <MunicipalityAccountsNavLink />\n','')
          s=re.sub(r'\n    <style>\{`\n      a\[href="/admin/projects/new"\],a\[href="/admin/public-projects"\]\{display:none!important\}\n    `\}</style>','',s)
          p.write_text(s)

          p=root/'components/admin-command-center.tsx'
          s=p.read_text()
          insert_after='const pick = (r: Row, keys: string[], fallback = "") =>\n  keys.map(k => r[k]).find(v => v !== undefined && v !== null && String(v).trim() !== "") ?? fallback;\n'
          actions='''\n\nconst ADMIN_EDIT_ACTIONS = [\n  ["/admin/projects/new", "New Project", "Create a complete project record"],\n  ["/admin/projects/legacy", "Legacy Registration", "Register or correct older projects"],\n  ["/admin/projects", "Project Editor", "Open any project and edit its full details"],\n  ["/admin/projects/locations", "Project Locations", "Edit project map and location data"],\n  ["/admin/projects/payment-routing", "Payment Routing", "Correct project/payment relationships"],\n  ["/admin/projects/reclassify", "Project Reclassify", "Correct project classifications"],\n  ["/admin/employees", "Employee Editor", "Edit employees, status and roles"],\n  ["/admin/proposals", "Proposal Editor", "Create and revise proposals"],\n  ["/admin/finance/bills", "Bills Editor", "Edit project billing records"],\n  ["/admin/finance/invoices", "Invoice Register", "Review and manage invoices"],\n  ["/admin/accounts/entry", "Main Accounts", "Create main account entries"],\n  ["/admin/accounts", "Ledger Editor", "Edit, reorder and correct ledger history"],\n  ["/admin/accounts/export", "Ledger Export", "Generate account exports"],\n  ["/admin/registers", "Document Registry", "Edit document and design-book records"],\n  ["/admin/site-visits", "Site Visits", "Review and correct site visit records"],\n  ["/admin/projects/website-curation", "Website Curation", "Control public project presentation"],\n  ["/admin/projects/website-readiness", "Website Readiness", "Fix public project completeness"],\n  ["/admin/municipality-accounts", "Municipality Accounts", "Manage municipality financial records"],\n  ["/admin/municipality-file-pass", "Municipality File Pass", "Manage municipality file workflow"],\n  ["/admin/access", "Access Control", "Manage permissions and role authority"],\n  ["/admin/security", "Security", "Manage Admin security controls"],\n  ["/admin/whatsapp", "WhatsApp", "Manage WhatsApp integration settings"],\n] as const;\n'''
          if insert_after not in s: raise RuntimeError('dashboard insert point not found')
          s=s.replace(insert_after,insert_after+actions,1)
          s=s.replace('  const full = role === "admin" || role === "manager";\n','  const full = role === "admin" || role === "manager";\n  const isAdmin = role === "admin";\n',1)
          css='''\n        .lv-admin-edit-center{margin-top:14px;padding:18px;border:1px solid var(--theme-line-_34414b,#34414b);border-radius:14px;background:linear-gradient(145deg,var(--theme-bg-_12191f,#12191f),var(--theme-bg-_0d1318,#0d1318))}\n        .lv-admin-edit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}.lv-admin-edit-head h2{margin:0;color:var(--theme-ink-_fff,#fff);font-size:18px}.lv-admin-edit-head p{margin:4px 0 0;color:var(--theme-ink-_7f8b95,#7f8b95);font-size:10px}.lv-admin-edit-head span{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ff686d}.lv-admin-edit-head>strong{color:#ff686d;font-size:10px}\n        .lv-admin-edit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.lv-admin-edit-link{min-height:64px;padding:11px 12px;border:1px solid var(--theme-line-_303b45,#303b45);border-radius:10px;background:var(--theme-bg-_151c22,#151c22);text-decoration:none;display:flex;flex-direction:column;justify-content:center;transition:.16s ease}.lv-admin-edit-link strong{color:var(--theme-ink-_f6f8fa,#f6f8fa);font-size:11px}.lv-admin-edit-link small{margin-top:4px;color:var(--theme-ink-_788691,#788691);font-size:8.5px;line-height:1.35}.lv-admin-edit-link:hover{border-color:var(--theme-line-_d61f26,#d61f26);transform:translateY(-1px);background:var(--theme-bg-_192128,#192128)}\n        @media(max-width:1180px){.lv-admin-edit-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}\n        @media(max-width:760px){.lv-admin-edit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lv-admin-edit-center{padding:14px}}\n'''
          marker='        @media(max-width:1100px)'
          if marker not in s: raise RuntimeError('dashboard css marker not found')
          s=s.replace(marker,css+marker,1)
          marker='''      </section>\n\n      {error && <div className="lv-error">'''
          center='''      </section>\n\n      {isAdmin && <section className="lv-admin-edit-center" aria-label="Admin Editing Center">\n        <div className="lv-admin-edit-head"><div><span>ADMIN AUTHORITY</span><h2>Admin Editing Center</h2><p>Direct access to every major editing and control workspace.</p></div><strong>{ADMIN_EDIT_ACTIONS.length} CONTROLS</strong></div>\n        <div className="lv-admin-edit-grid">{ADMIN_EDIT_ACTIONS.map(([href,label,description]) => <Link key={href} href={href} className="lv-admin-edit-link"><strong>{label}</strong><small>{description}</small></Link>)}</div>\n      </section>}\n\n      {error && <div className="lv-error">'''
          if marker not in s: raise RuntimeError('dashboard hero marker not found')
          s=s.replace(marker,center,1)
          p.write_text(s)

          p=root/'app/admin/admin-layout-polish.css'
          s=p.read_text()
          s += '''\n\n/* =========================================================\n   ADMIN SIDEBAR SIZE + EDITING PASS\n   Larger readable controls, fixed shell, independently scrollable navigation.\n   ========================================================= */\n@media screen and (min-width: 901px) {\n  .portal-admin { --lv-sidebar-width: 286px !important; }\n  .portal-admin .primary-nav { overflow: hidden !important; }\n  .portal-admin .primary-nav-inner { display:block!important;flex:1 1 auto!important;min-height:0!important;padding:14px 12px 24px!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain!important;scrollbar-width:thin!important;scrollbar-color:#3a4650 transparent!important; }\n  .portal-admin .primary-nav-inner::-webkit-scrollbar{width:7px}.portal-admin .primary-nav-inner::-webkit-scrollbar-track{background:transparent}.portal-admin .primary-nav-inner::-webkit-scrollbar-thumb{background:#323d46;border-radius:10px}.portal-admin .primary-nav-inner::-webkit-scrollbar-thumb:hover{background:#485761}\n  .portal-admin .sidebar-nav-section{display:grid!important;gap:5px!important;margin:0 0 15px!important}\n  .portal-admin .sidebar-section-label{padding:7px 10px 5px!important;color:#697681!important;font-size:9px!important;line-height:1!important;font-weight:900!important;letter-spacing:.14em!important;text-transform:uppercase!important;user-select:none!important}\n  .portal-admin .sidebar-admin-editing{margin-top:5px!important;padding-top:9px!important;border-top:1px solid #252d34!important}.portal-admin .sidebar-admin-editing .sidebar-section-label{color:#ff7479!important}\n  .portal-admin .primary-nav a,.portal-admin .estimate-nav-trigger{min-height:48px!important;padding:0 14px 0 15px!important;gap:12px!important;border-radius:10px!important;font-size:12.25px!important;line-height:1.2!important;letter-spacing:.01em!important;font-weight:800!important}\n  .portal-admin .nav-icon{width:24px!important;height:24px!important;flex:0 0 24px!important;font-size:17px!important}\n  .portal-admin .sidebar-brand{height:88px!important;padding:18px 19px!important}.portal-admin .sidebar-brand img{width:48px!important;height:48px!important;flex-basis:48px!important}.portal-admin .sidebar-brand strong{font-size:18px!important}.portal-admin .sidebar-brand small{font-size:7.5px!important}\n}\n@media screen and (max-width:900px){\n  .portal-admin .primary-nav.open .primary-nav-inner{display:block!important;padding:8px 0 20px!important}.portal-admin .sidebar-nav-section{display:grid!important;gap:5px!important;margin-bottom:14px!important}\n  .portal-admin .sidebar-section-label{padding:8px 12px 4px!important;color:#7b8791!important;font-size:9px!important;font-weight:900!important;letter-spacing:.12em!important;text-transform:uppercase!important}.portal-admin .sidebar-admin-editing .sidebar-section-label{color:#ff7479!important}\n  .portal-admin .primary-nav.open .sidebar-nav-section a{display:flex!important;width:100%!important;min-height:48px!important;padding:0 14px!important;box-sizing:border-box!important}\n}\n'''
          p.write_text(s)
          PY
      - name: Verify diff
        run: git diff --check
      - name: Install
        run: npm ci --silent
      - name: Build
        run: npm run build
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'LAND VIEW CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/admin/admin-layout-polish.css app/admin/layout.tsx components/admin-command-center.tsx components/management-shell-v2.tsx
          git commit -m 'Apply admin sidebar editing pass'
          git push origin HEAD:fix/admin-sidebar-editing-pass
