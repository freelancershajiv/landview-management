name: Phase 2 UI source migration

on:
  push:
    branches:
      - refactor/ui-system-cleanup-phase-2-20261024

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-system-cleanup-phase-2-20261024
          fetch-depth: 0

      - name: Migrate component-local styles to shared tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('app/login/page.tsx'),
              Path('components/public-header.tsx'),
              Path('components/public-home.tsx'),
              Path('components/public-lead-actions.tsx'),
              Path('components/contact-map-enhancer.tsx'),
              Path('components/role-portal-shell.tsx'),
              Path('app/client/client.module.css'),
          ]

          brand_hexes = [
              '#ef4a50','#d61f26','#ad171d','#ef493b','#ef766c','#ef776e',
              '#ed302f','#c91f2e','#f03b3a','#d92532','#9d1725','#ff6369',
              '#ff777b','#ff666c','#efb733','#d79a17','#e6aa27','#c98709',
          ]
          brand_re = '|'.join(re.escape(x) for x in brand_hexes)

          def migrate_colors(text: str) -> str:
              # Preserve intent first: foreground accents use brand-text; filled actions use brand-primary.
              text = re.sub(rf'color\s*:\s*(?:var\([^;}}]*?({brand_re})\)|({brand_re}))', 'color:var(--lv-brand-text)', text, flags=re.I)
              text = re.sub(rf'accent-color\s*:\s*(?:var\([^;}}]*?({brand_re})\)|({brand_re}))', 'accent-color:var(--lv-brand-primary)', text, flags=re.I)
              text = re.sub(rf'border-color\s*:\s*(?:var\([^;}}]*?({brand_re})\)|({brand_re}))', 'border-color:var(--lv-brand-primary)', text, flags=re.I)
              text = re.sub(rf'background\s*:\s*linear-gradient\([^;}}]*?(?:{brand_re})[^;}}]*?\)', 'background:var(--lv-brand-primary)', text, flags=re.I)
              text = re.sub(rf'background\s*:\s*(?:var\([^;}}]*?({brand_re})\)|({brand_re}))', 'background:var(--lv-brand-primary)', text, flags=re.I)
              text = re.sub(rf'(\b(?:1px|2px|3px|4px|5px)\s+solid\s+)(?:var\([^;}}]*?({brand_re})\)|({brand_re}))', r'\1var(--lv-brand-primary)', text, flags=re.I)

              # Legacy red/gold alpha colors become semantic brand soft/border/ring tokens.
              red_rgba = re.compile(r'rgba\(\s*(?:214\s*,\s*31\s*,\s*38|216\s*,\s*31\s*,\s*39|239\s*,\s*74\s*,\s*80|239\s*,\s*73\s*,\s*59|215\s*,\s*154\s*,\s*23|239\s*,\s*183\s*,\s*51)\s*,\s*(0?\.\d+)\s*\)', re.I)
              def rgba_token(m):
                  alpha = float(m.group(1))
                  if alpha >= .25:
                      return 'var(--lv-brand-border)'
                  if alpha >= .16:
                      return 'var(--lv-brand-ring)'
                  return 'var(--lv-brand-soft)'
              text = red_rgba.sub(rgba_token, text)

              # Collapse legacy generated theme wrappers when their fallback has become a shared token.
              text = re.sub(r'var\(--theme-ink-[^,)]*,\s*var\(--lv-brand-primary\)\)', 'var(--lv-brand-text)', text)
              text = re.sub(r'var\(--theme-line-[^,)]*,\s*var\(--lv-brand-primary\)\)', 'var(--lv-brand-border)', text)
              text = re.sub(r'var\(--theme-(?:bg|shadow)-[^,)]*,\s*var\(--lv-brand-(?:soft|ring|border)\)\)', lambda m: m.group(0).split(', ',1)[1][:-1], text)

              # Any surviving known brand literal is a legacy fallback; source it from the central palette.
              for value in brand_hexes:
                  text = re.sub(re.escape(value), 'var(--lv-brand-primary)', text, flags=re.I)

              # Direct white UI literals should follow the chrome/elevated text system.
              text = re.sub(r'color\s*:\s*#fff\b', 'color:var(--lv-text-on-chrome)', text, flags=re.I)
              text = re.sub(r'color\s*:\s*white\b', 'color:var(--lv-text-on-chrome)', text, flags=re.I)
              text = re.sub(r'var\(--theme-ink-(?:_fff|white),\s*(?:#fff|white)\)', 'var(--lv-text-on-chrome)', text, flags=re.I)
              text = re.sub(r'background\s*:\s*#fff\b', 'background:var(--lv-surface-elevated)', text, flags=re.I)

              # Source-level success semantics used by login/admin-as-employee indicators.
              text = re.sub(r'#57bd7b\b', 'var(--lv-success-solid)', text, flags=re.I)
              text = re.sub(r'#(?:7ee4ae|a7eac6|a0d7b0|a8dbb7|7da98a)\b', 'var(--lv-success)', text, flags=re.I)
              text = re.sub(r'rgba\(\s*69\s*,\s*200\s*,\s*132\s*,\s*0?\.(?:08|12)\s*\)', 'var(--lv-success-soft)', text, flags=re.I)
              text = re.sub(r'rgba\(\s*69\s*,\s*200\s*,\s*132\s*,\s*0?\.45\s*\)', 'var(--lv-success)', text, flags=re.I)
              return text

          def floor_type(text: str, path: Path) -> str:
              # Raise only very small UI labels; 12px+ body/control text remains untouched.
              rules = {
                  'app/login/page.tsx': [('7px','10px'),('8px','10px'),('9px','11px'),('10px','11px')],
                  'components/role-portal-shell.tsx': [('6.5px','10px'),('8px','10px'),('9px','11px'),('10px','11px'),('10.5px','11.5px')],
                  'components/public-home.tsx': [('6px','10px'),('7px','10px'),('8px','10px'),('9px','11px')],
                  'components/contact-map-enhancer.tsx': [('7px','10px'),('8px','10px'),('9px','11px')],
                  'components/public-lead-actions.tsx': [('10px','11px')],
                  'components/public-header.tsx': [],
                  'app/client/client.module.css': [('8px','10px'),('9px','11px')],
              }
              for old, new in rules.get(path.as_posix(), []):
                  text = re.sub(rf'font-size\s*:\s*{re.escape(old)}\b', f'font-size:{new}', text)
              return text

          changed = []
          before_legacy = 0
          after_legacy = 0
          legacy_probe = re.compile(brand_re, re.I)
          tiny_probe = re.compile(r'font-size\s*:\s*(?:[0-9](?:\.\d+)?)px\b')

          for path in targets:
              if not path.exists():
                  raise SystemExit(f'Missing target: {path}')
              old = path.read_text(encoding='utf-8')
              before_legacy += len(legacy_probe.findall(old))
              new = floor_type(migrate_colors(old), path)
              after_legacy += len(legacy_probe.findall(new))
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())
              tiny = tiny_probe.findall(new)
              print(f'{path}: changed={new != old}; remaining legacy brand={len(legacy_probe.findall(new))}; remaining sub-10px={len(tiny)}')

          print('changed files:', ', '.join(changed))
          print('legacy brand literals:', before_legacy, '->', after_legacy)
          if after_legacy:
              raise SystemExit('Legacy LAND VIEW brand literals remain in Phase 2 targets.')
          if not changed:
              raise SystemExit('Migration produced no changes.')
          PY

      - name: Commit source migration
        shell: bash
        run: |
          git config user.name "LAND VIEW UI Migration"
          git config user.email "actions@users.noreply.github.com"
          git add app/login/page.tsx app/client/client.module.css components/public-header.tsx components/public-home.tsx components/public-lead-actions.tsx components/contact-map-enhancer.tsx components/role-portal-shell.tsx
          git commit -m "Migrate portal and public component styles to shared UI tokens"
          git push origin HEAD:refactor/ui-system-cleanup-phase-2-20261024
