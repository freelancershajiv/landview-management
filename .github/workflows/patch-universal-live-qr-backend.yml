name: Patch universal live QR backend

on:
  push:
    branches:
      - universal-live-project-qr-20260914
    paths:
      - scripts/patch_universal_live_qr_backend.py
      - .github/workflows/patch-universal-live-qr-backend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Code.gs for permanent live project QR
        run: python scripts/patch_universal_live_qr_backend.py
      - name: Commit patched Apps Script backend
        run: |
          if git diff --quiet -- Code.gs; then
            echo "Code.gs already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs
          git commit -m "Enable public live project billing verification"
          git push origin universal-live-project-qr-20260914
