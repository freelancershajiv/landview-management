name: Patch invoice print contrast

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-invoice-print-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair invoice print contrast
        run: python scripts/patch_invoice_print_contrast.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/finance/invoices/page.tsx app/admin/finance/invoices/invoice.module.css
          git commit -m "Fix printed invoice table contrast"
          git push
