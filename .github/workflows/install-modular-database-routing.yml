name: Install modular database routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-modular-database-routing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Apps Script database routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          code = Path('Code.gs')
          text = code.read_text()
          original = text

          # Route the central getSheet helper through the module database router.
          pattern = r'(function\s+getSheet\s*\(\s*name\s*\)\s*\{.*?const\s+ss\s*=\s*)getSpreadsheet\(\)(\s*;)'
          text, count = re.subn(pattern, r'\1getSpreadsheetForSheet_(name)\2', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not patch getSheet(name) in Code.gs')

          code.write_text(text)

          # Certificate registry/request traffic should always use the dedicated
          # certificate database once this Apps Script source is deployed.
          for filename in ['CertificateRegistry.gs', 'CertificatePortal.gs']:
              p = Path(filename)
              s = p.read_text()
              s2 = s.replace('const ss = getFinanceWorkbook_();', 'const ss = getCertificateDatabase_();', 1)
              if s2 == s:
                  raise SystemExit(f'Could not patch certificate database in {filename}')
              p.write_text(s2)

          print('Modular routing patch applied.')
          PY
      - name: Commit routing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs CertificateRegistry.gs CertificatePortal.gs
          if git diff --cached --quiet; then
            echo "No routing changes required."
            exit 0
          fi
          git commit -m "Route Apps Script data by module database"
          git push
