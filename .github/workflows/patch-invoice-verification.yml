name: Patch invoice verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-invoice-verification.yml
      - scripts/patch_invoice_verification.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch invoice verification linkage
        run: python3 scripts/patch_invoice_verification.py

      - name: Publish invoice verification files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          allowed = {
              "FinanceSheet.gs",
              "lib/sheet-invoices.ts",
              "app/admin/finance/invoices/page.tsx",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          files = sorted(changed & allowed)
          if not files:
              print("Invoice verification is already patched")
              raise SystemExit(0)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "land-view-invoice-verification",
          }

          for path in files:
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              with urllib.request.urlopen(urllib.request.Request(url + "?ref=main", headers=headers), timeout=30) as response:
                  current = json.load(response)
              payload = {
                  "message": "Connect invoice receipts to accounting verification",
                  "content": base64.b64encode(open(path, "rb").read()).decode("ascii"),
                  "branch": "main",
                  "sha": current["sha"],
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              print(path, result.get("commit", {}).get("sha", ""))
          PY
