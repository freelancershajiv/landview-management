name: One-time project client-name display patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-project-client-name-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prioritize client name on Projects page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/admin/projects/page.tsx')
          text = p.read_text()
          old_const = 'const name = String(project.Project_Name || id);'
          new_const = '''const projectName = String(project.Project_Name || "").trim();
                const clientName = String(project.Client_Name || projectName || id).trim();
                const secondaryProjectName = projectName && projectName.toLowerCase() !== clientName.toLowerCase() ? projectName : "";'''
          old_cell = '<strong>{name}</strong>{project.Phone_Number && <small>{String(project.Phone_Number)}</small>}'
          new_cell = '<strong>{clientName}</strong>{secondaryProjectName && <small>{secondaryProjectName}</small>}{project.Phone_Number && <small>{String(project.Phone_Number)}</small>}'
          if old_const not in text or old_cell not in text:
              raise SystemExit('Expected Projects display tokens were not found; refusing to patch blindly.')
          text = text.replace(old_const, new_const, 1).replace(old_cell, new_cell, 1)
          p.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-project-client-name-display.yml
          git add app/admin/projects/page.tsx
          git commit -m "Prioritize client names on Projects page"
          git push
