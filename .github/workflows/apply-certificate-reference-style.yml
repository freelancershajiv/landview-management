name: Apply certificate reference style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-certificate-reference-style.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply LAND VIEW reference certificate design
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/admin/certificates/page.tsx')
          s = path.read_text()

          old_employee = 'employee: { label: "Employee Certificate", position: "Employee", statement: "This is to certify that the person named above is / was associated with LAND VIEW — Engineers and Architects in the stated position and capacity." },'
          new_employee = 'employee: { label: "Experience Certificate", position: "Employee", statement: "During the tenure, the employee has been primarily responsible for site management, construction supervision, coordination, and day-to-day monitoring across structural and architectural projects.\\n\\nMajor duties and responsibilities included:\\n• Managing day-to-day site activities and monitoring the progress of construction work.\\n• Supervising construction materials, concrete work, reinforcement layouts, and other site operations.\\n• Coordinating with contractors, masons, laboratory technicians, suppliers, and project personnel.\\n• Maintaining daily site records, progress reports, work schedules, and quality-control documentation.\\n\\nThroughout the service period, the employee’s professional conduct, site management capability, coordination skills, problem-solving ability, and commitment to project quality have been highly commendable. The employee has demonstrated dedication, responsibility, and technical capability.\\n\\nWe wish continued success." },'
          if old_employee in s:
              s = s.replace(old_employee, new_employee)

          css_pattern = re.compile(r'\.certificate-paper\{width:min\(100%,980px\);.*?@media print\{body \*\{visibility:hidden!important\}.*?@page\{size:A4 landscape;margin:0\}\}', re.S)
          new_css = r'''.certificate-paper{width:min(100%,794px);height:auto;min-height:1123px;aspect-ratio:210/297;margin:auto;background:#fff;color:#171717;position:relative;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.34);font-family:Arial,Helvetica,sans-serif;padding:190px 54px 182px;border-top:4px solid #e21b23}.certificate-paper:before{content:"";position:absolute;z-index:0;right:-124px;top:-104px;width:545px;height:275px;background:linear-gradient(135deg,#25282a 0%,#111 58%,#050505 100%);transform:rotate(24deg);box-shadow:0 10px 0 #e31c24}.certificate-paper:after{content:"";position:absolute;z-index:0;left:-120px;right:-120px;bottom:-94px;height:190px;background:linear-gradient(168deg,#e21b23 0 7%,#202326 7% 30%,#0d0f10 30% 100%);transform:rotate(3deg)}.certificate-header{position:absolute;z-index:2;left:54px;right:54px;top:34px;display:flex;justify-content:space-between;align-items:flex-start}.certificate-brand{width:430px}.certificate-brand img{display:block;width:330px;height:auto;max-height:84px;object-fit:contain;object-position:left top}.certificate-brand .cert-slogan{display:flex;align-items:center;gap:10px;margin:8px 0 0 81px;font-size:9px;letter-spacing:.22em}.certificate-brand .cert-slogan:before,.certificate-brand .cert-slogan:after{content:"";width:58px;height:2px;background:#e21b23}.certificate-brand .cert-slogan-text{display:grid;gap:2px;text-align:center;white-space:nowrap}.certificate-brand .cert-slogan-text strong{font-size:11px;letter-spacing:0;font-family:"Noto Sans Bengali",Arial,sans-serif}.certificate-brand .cert-slogan-text span{font-size:7px;font-weight:800;letter-spacing:.24em}.certificate-manifesto{color:#fff;font-size:9px;line-height:1.5;letter-spacing:.24em;text-align:left;margin-top:0;width:120px}.certificate-refline{position:relative;z-index:2;display:flex;justify-content:space-between;font-size:11px;margin:0 0 32px;padding:0 1px}.certificate-title{position:relative;z-index:2;text-align:center;margin:0}.certificate-title h2{margin:0;font-size:36px;line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}.certificate-title h2 .red-word{color:#d71920}.certificate-concern{display:flex;align-items:center;gap:14px;margin:22px auto 0;max-width:690px;color:#111;font-size:11px;font-weight:900;letter-spacing:.48em;white-space:nowrap}.certificate-concern:before,.certificate-concern:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,#171717 0 65%,#e21b23 65% 100%)}.certificate-body{position:relative;z-index:2;margin-top:39px;font-size:12px;line-height:1.58;text-align:left}.certificate-body p{margin:0 0 17px}.certificate-intro{font-size:12.5px;line-height:1.6;text-align:justify}.certificate-name,.certificate-position{font-weight:900}.certificate-address{font-weight:500}.certificate-subject{border-left:3px solid #e21b23;background:#f5f5f5;padding:8px 10px;margin:0 0 17px!important;font-size:10px!important;font-weight:800;letter-spacing:.03em}.certificate-description{white-space:pre-line;text-align:justify}.certificate-description::first-line{font-weight:500}.certificate-closing{text-align:justify}.certificate-signature-zone{position:absolute;z-index:3;left:58px;right:54px;bottom:128px;display:grid;grid-template-columns:1.55fr .82fr .72fr;gap:26px;align-items:end}.certificate-signature{font-size:9px;line-height:1.45}.certificate-signature .signature-script{font:italic 24px/1.1 Georgia,"Times New Roman",serif;margin-bottom:1px;transform:skew(-9deg);transform-origin:left center}.certificate-signature .signature-line{width:190px;border-top:1px solid #181818;margin:0 0 5px}.certificate-signature strong{display:block;font-size:11px}.certificate-signature b{display:block;color:#d71920;font-size:14px;letter-spacing:.03em}.certificate-seal{width:102px;height:102px;border:3px solid #174d9a;border-radius:50%;display:grid;place-items:center;text-align:center;color:#174d9a;font-size:7px;font-weight:900;letter-spacing:.08em;position:relative;justify-self:center}.certificate-seal:before,.certificate-seal:after{content:"";position:absolute;border-radius:50%;inset:6px;border:1px solid #174d9a}.certificate-seal:after{inset:21px}.certificate-seal img{width:35px;height:35px;object-fit:contain;z-index:2}.certificate-seal span{position:absolute;bottom:9px;z-index:2;background:#fff;padding:0 3px}.certificate-verify-block{display:grid;justify-items:end;gap:3px}.certificate-side-motto{font-size:8px;line-height:1.25;letter-spacing:.09em;border-left:2px solid #222;padding-left:8px;text-align:left;width:76px;margin-right:3px}.certificate-side-motto:after{content:"";display:block;width:38px;height:2px;background:#e21b23;margin-top:7px}.certificate-qr{text-align:right;font-size:7px;color:#222}.certificate-qr img{width:78px;height:78px;display:block;margin-left:auto;border:2px solid #111}.certificate-qr strong{display:block;margin-top:3px;font-size:8px}.certificate-qr span{display:block;font-size:6px;color:#555}.certificate-footer{position:absolute;z-index:3;left:48px;right:48px;bottom:20px;color:#fff;display:grid;grid-template-columns:1fr 1.25fr 1.15fr;gap:24px;align-items:center;font-size:8px}.certificate-footer>div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.certificate-footer .cert-icon{font-size:19px;line-height:1}.certificate-footer strong{font-size:8px}.certificate-footer small{display:block;font-size:5.5px;letter-spacing:.11em;color:#bbb;margin-top:2px}.certificate-watermark{position:absolute;z-index:1;right:-6px;bottom:190px;width:195px;height:410px;opacity:.045;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 22px),repeating-linear-gradient(0deg,#111 0 2px,transparent 2px 30px);transform:skewY(-9deg)}.cert-empty{padding:24px;text-align:center;color:#7f868c;font-size:12px}@media(max-width:950px){.cert-layout{grid-template-columns:1fr}.cert-stats{grid-template-columns:1fr 1fr}}@media(max-width:620px){.cert-grid{grid-template-columns:1fr}.cert-field.full{grid-column:auto}.cert-tabs{grid-template-columns:1fr}.certificate-paper{width:100%;min-height:930px;padding:156px 32px 150px}.certificate-header{left:32px;right:32px;top:28px}.certificate-brand{width:270px}.certificate-brand img{width:240px}.certificate-brand .cert-slogan{margin-left:35px}.certificate-brand .cert-slogan:before,.certificate-brand .cert-slogan:after{width:26px}.certificate-manifesto{display:none}.certificate-title h2{font-size:27px}.certificate-concern{font-size:8px;letter-spacing:.26em}.certificate-body{font-size:10px}.certificate-intro{font-size:10.5px}.certificate-signature-zone{left:34px;right:32px;bottom:121px;grid-template-columns:1.4fr .7fr .8fr;gap:11px}.certificate-seal{width:78px;height:78px}.certificate-qr img{width:62px;height:62px}.certificate-footer{left:26px;right:26px;gap:10px;font-size:6px}.certificate-footer .cert-icon{font-size:14px}}@media print{body *{visibility:hidden!important}.certificate-paper,.certificate-paper *{visibility:visible!important}.certificate-paper{position:absolute;inset:0;width:210mm!important;height:297mm!important;min-height:297mm!important;max-width:none!important;margin:0!important;box-shadow:none!important;padding:50mm 14.3mm 48mm!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.certificate-header{left:14.3mm!important;right:14.3mm!important;top:9mm!important}.certificate-signature-zone{left:15.3mm!important;right:14.3mm!important;bottom:34mm!important}.certificate-footer{left:12.7mm!important;right:12.7mm!important;bottom:5.3mm!important}.certificate-actions{display:none!important}@page{size:A4 portrait;margin:0}}'''
          s, css_count = css_pattern.subn(new_css, s, count=1)
          if css_count != 1:
              raise SystemExit(f'certificate CSS replacement failed: {css_count}')

          preview_pattern = re.compile(r'\{issued && <section className="certificate-wrap" id="certificate-preview">.*?</section>\}', re.S)
          new_preview = '''{issued && <section className="certificate-wrap" id="certificate-preview"><div className="certificate-actions"><a href={issued.verificationUrl} target="_blank" rel="noreferrer">VERIFY ONLINE</a><button onClick={() => window.print()}>PRINT / SAVE PDF</button></div><article className={`certificate-paper certificate-${issued.type}`}>
      <div className="certificate-watermark"/>
      <div className="certificate-header"><div className="certificate-brand"><img src="/land-view-logo-full.svg" alt="LAND VIEW Engineering & Architectural Consultancy"/><div className="cert-slogan"><div className="cert-slogan-text"><strong>স্থাপত্য নির্মাণ হোক নিরাপদ</strong><span>BUILD A SAFER TOMORROW</span></div></div></div><div className="certificate-manifesto">DESIGN<br/>PLAN<br/>SUPERVISE<br/>BUILD<br/>FOR A BETTER<br/>BANGLADESH</div></div>
      <div className="certificate-refline"><span>Ref: {issued.reference || issued.certificateId}</span><span>Date: {displayDate(issued.issuedAt)}</span></div>
      <div className="certificate-title"><h2>{issued.type === "employee" ? <>EXPERIENCE <span className="red-word">CERTIFICATE</span></> : <>{meta[issued.type].label.replace(/ Certificate$/i, "")} <span className="red-word">CERTIFICATE</span></>}</h2><div className="certificate-concern">TO WHOM IT MAY CONCERN</div></div>
      <div className="certificate-body">
        <p className="certificate-intro">This is to certify that <span className="certificate-name">{issued.name}</span>{issued.address ? <>, of <span className="certificate-address">{issued.address}</span></> : null}, has been serving / served in the capacity of <span className="certificate-position">{issued.position}</span> at <strong>LAND VIEW — Engineering & Architectural Consultancy</strong>{issued.reference ? <> under reference <strong>{issued.reference}</strong></> : null}.</p>
        {issued.subject && <p className="certificate-subject">{issued.subject}</p>}
        <p className="certificate-description">{issued.description}</p>
        <p className="certificate-closing">Throughout the period covered by this certificate, the above-named person, project, or property has demonstrated satisfactory professional conduct, coordination, responsibility, and commitment to quality.</p>
        <p>We wish continued success.</p>
      </div>
      <div className="certificate-signature-zone"><div className="certificate-signature"><div className="signature-script">Authorized</div><div className="signature-line"/><strong>Managing Director &amp; CEO</strong><b>LAND VIEW</b><span>Engineering &amp; Architectural Consultancy</span></div><div className="certificate-seal"><img src="/land-view-logo.svg" alt="LAND VIEW seal"/><span>BUILD SAFER SPACES</span></div><div className="certificate-verify-block"><div className="certificate-side-motto">PEOPLE<br/>PLANS<br/>PLACES<br/>POSSIBILITIES</div><div className="certificate-qr"><img src={issued.qrUrl} alt="Certificate verification QR"/><strong>Verify Certificate</strong><span>landview.com.bd/verify</span></div></div></div>
      <div className="certificate-footer"><div><span className="cert-icon">●</span><span><strong>Feni, Bangladesh</strong><small>LOCAL EXPERTISE. A SAFER TOMORROW.</small></span></div><div><span className="cert-icon">◎</span><span><strong>www.landview.com.bd</strong><small>BUILDING BETTER SPACES TOGETHER</small></span></div><div><span className="cert-icon">✉</span><span><strong>info@landview.com.bd</strong><small>DESIGN  |  ENGINEER  |  SUPERVISE</small></span></div></div>
    </article></section>}'''
          s, preview_count = preview_pattern.subn(new_preview, s, count=1)
          if preview_count != 1:
              raise SystemExit(f'certificate preview replacement failed: {preview_count}')

          path.write_text(s)

      - name: Commit certificate design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/certificates/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Match certificate print layout to LAND VIEW reference"
          git push origin main
