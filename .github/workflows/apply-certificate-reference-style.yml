name: Apply certificate reference style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-certificate-reference-style.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restyle admin-generated certificate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/admin/certificates/page.tsx')
          s = path.read_text()

          old_css = re.compile(r'\.certificate-paper\{.*?\.cert-empty\{padding:24px;text-align:center;color:#7f868c;font-size:12px\}', re.S)
          new_css = '''.certificate-paper{width:min(100%,794px);min-height:1123px;margin:auto;background:#fff;color:#151515;padding:58px 58px 54px;position:relative;box-shadow:0 18px 45px rgba(0,0,0,.28);font-family:Arial,Helvetica,sans-serif}.certificate-paper:before{content:"";position:absolute;inset:18px;border:2px solid #bb161b;pointer-events:none}.certificate-paper:after{content:"";position:absolute;inset:24px;border:1px solid #111;pointer-events:none}.certificate-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}.certificate-brand{display:flex;align-items:center;gap:10px}.certificate-brand img{width:92px;height:auto}.certificate-brand strong{display:block;font-size:22px;letter-spacing:.08em;color:#b3151a}.certificate-brand span{display:block;font-size:10px;letter-spacing:.18em;color:#222;margin-top:2px}.certificate-meta{text-align:right;font-size:11px;line-height:1.8;color:#222}.certificate-meta strong{font-weight:700}.certificate-title{text-align:center;margin-top:74px;position:relative;z-index:1}.certificate-title h2{font:700 19px/1.3 Georgia,"Times New Roman",serif;letter-spacing:.02em;text-decoration:underline;text-underline-offset:5px;margin:0}.certificate-body{position:relative;z-index:1;margin:48px 6px 0;font:400 13px/1.75 Georgia,"Times New Roman",serif;text-align:justify}.certificate-body p{margin:0 0 18px}.certificate-body .certificate-lead strong{font-weight:700}.certificate-body .certificate-description{white-space:pre-line}.certificate-body ul{margin:18px 0 18px 22px;padding:0}.certificate-body li{margin:7px 0;padding-left:3px}.certificate-closing{margin-top:22px}.certificate-bottom{position:absolute;z-index:1;left:64px;right:64px;bottom:72px;display:flex;justify-content:space-between;align-items:flex-end}.certificate-signature{font:400 12px/1.45 Georgia,"Times New Roman",serif;min-width:215px}.certificate-signature .line{width:155px;border-top:1px solid #111;margin-bottom:7px}.certificate-signature strong{font-weight:700}.certificate-verify{text-align:right;font-size:8px;color:#555}.certificate-verify img{width:62px;height:62px;display:block;margin-left:auto;margin-bottom:4px}.cert-empty{padding:24px;text-align:center;color:#7f868c;font-size:12px}'''
          s, n1 = old_css.subn(new_css, s, count=1)
          if n1 != 1:
              raise SystemExit(f'certificate CSS replacement failed: {n1}')

          old_preview = re.compile(r'\{issued && <section className="certificate-wrap" id="certificate-preview">.*?</section>\}', re.S)
          new_preview = '''{issued && <section className="certificate-wrap" id="certificate-preview"><div className="certificate-actions"><a href={issued.verificationUrl} target="_blank" rel="noreferrer">VERIFY ONLINE</a><button onClick={() => window.print()}>PRINT / SAVE PDF</button></div><article className="certificate-paper">
      <div className="certificate-top"><div className="certificate-brand"><img src="/land-view-logo.png" alt="LAND VIEW"/><div><strong>LAND VIEW</strong><span>ENGINEERS & ARCHITECTS</span></div></div><div className="certificate-meta"><div><strong>No:</strong> {issued.certificateId}</div><div><strong>Date:</strong> {displayDate(issued.issuedAt)}</div></div></div>
      <div className="certificate-title"><h2>TO WHOM IT MAY CONCERN</h2></div>
      <div className="certificate-body">
        <p className="certificate-lead">This is to certify that <strong>{issued.name}</strong>{issued.position ? <>, serving in the capacity of <strong>{issued.position}</strong></> : null}{issued.address ? <>, of {issued.address}</> : null}, has been associated with <strong>LAND VIEW Engineers & Architects</strong>{issued.reference ? <> under reference <strong>{issued.reference}</strong></> : null}.</p>
        {issued.subject && <p><strong>{issued.subject}</strong></p>}
        <p className="certificate-description">{issued.description}</p>
        <p className="certificate-closing">Throughout the period covered by this certificate, the above-named person/project has demonstrated satisfactory professional conduct, coordination, responsibility, and commitment to quality.</p>
        <p>We wish continued success.</p>
      </div>
      <div className="certificate-bottom"><div className="certificate-signature"><div className="line"/><strong>Managing Director &amp; CEO</strong><br/>LAND VIEW Engineers &amp; Architects</div><div className="certificate-verify"><img src={issued.qrUrl} alt="Certificate verification QR"/>SCAN TO VERIFY</div></div>
    </article></section>}'''
          s, n2 = old_preview.subn(new_preview, s, count=1)
          if n2 != 1:
              raise SystemExit(f'certificate preview replacement failed: {n2}')

          s = s.replace('@media print{body *{visibility:hidden!important}.certificate-paper,.certificate-paper *{visibility:visible!important}.certificate-paper{position:absolute;inset:0;width:100%;height:100%;box-shadow:none}.certificate-actions{display:none!important}@page{size:A4 landscape;margin:0}}', '@media print{body *{visibility:hidden!important}.certificate-paper,.certificate-paper *{visibility:visible!important}.certificate-paper{position:absolute;inset:0;width:210mm;height:297mm;min-height:297mm;margin:0;box-shadow:none;padding:16mm 15mm 15mm}.certificate-actions{display:none!important}@page{size:A4 portrait;margin:0}}')
          s = s.replace('@media(max-width:620px){.cert-grid{grid-template-columns:1fr}.cert-field.full{grid-column:auto}.cert-tabs{grid-template-columns:1fr}.certificate-paper{min-height:680px;aspect-ratio:auto;padding:34px}.certificate-bottom{left:34px;right:34px}}', '@media(max-width:620px){.cert-grid{grid-template-columns:1fr}.cert-field.full{grid-column:auto}.cert-tabs{grid-template-columns:1fr}.certificate-paper{min-height:900px;padding:38px 34px}.certificate-bottom{left:46px;right:46px}.certificate-brand img{width:72px}.certificate-title{margin-top:50px}.certificate-body{margin-top:34px;font-size:12px}}')
          path.write_text(s)
          PY
      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-certificate-reference-style.yml
      - name: Commit certificate design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match admin certificate to A4 reference style"
          git push
