name: Apply international WhatsApp project groups

on:
  push:
    branches:
      - feature/international-whatsapp-project-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/international-whatsapp-project-groups
          fetch-depth: 0
      - name: Apply verified LAND VIEW patch
        shell: bash
        run: |
          cat .github/landview-temp/international-wa.part* > /tmp/international-wa.b64
          base64 -d /tmp/international-wa.b64 | gzip -d > /tmp/international-wa.patch
          echo "296a19b8e7c9b943e79329ee5f4ab80745f47d61904d938f3431ef6c6f282a1a  /tmp/international-wa.patch" | sha256sum -c -
          git apply --check /tmp/international-wa.patch
          git apply /tmp/international-wa.patch
          rm -rf .github/landview-temp
          rm .github/workflows/apply-international-whatsapp-project-groups.yml
          git config user.name "LAND VIEW Automation"
          git config user.email "automation@landview.com.bd"
          git add -A
          git commit -m "Support international WhatsApp and project groups"
          git push origin HEAD:feature/international-whatsapp-project-groups
