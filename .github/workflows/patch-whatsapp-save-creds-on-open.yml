name: Patch WhatsApp auth persistence

on:
  push:
    branches:
      - fix/persist-whatsapp-auth-on-open
    paths:
      - scripts/patch-whatsapp-save-creds-on-open.mjs
      - .github/workflows/patch-whatsapp-save-creds-on-open.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-whatsapp-auth-on-open
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-whatsapp-save-creds-on-open.mjs
      - name: Check WhatsApp service syntax
        run: node --check whatsapp-service/server.mjs
      - name: Commit patched service
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "landview-ci"
          git config user.email "actions@users.noreply.github.com"
          git add whatsapp-service/server.mjs
          git commit -m "Persist WhatsApp credentials when sessions open [auth-open-persist]"
          git push origin HEAD:fix/persist-whatsapp-auth-on-open
