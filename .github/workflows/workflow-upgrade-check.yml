name: LAND VIEW Workflow Upgrade Verification

on:
  pull_request:
    paths:
      - "app/admin/project-operations/overview/**"
      - "app/api/admin/workflow/overview/**"
      - "app/admin/project-operations/layout.tsx"
      - "app/admin/workflow/page.tsx"
      - "app/admin/project-operations/project-workflow/page.tsx"
      - ".github/workflows/workflow-upgrade-check.yml"
      - "tests/workflow-upgrade.test.cjs"

permissions:
  contents: read

jobs:
  verify-workflow-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed Workflow files
        run: npx eslint app/api/admin/workflow/overview/route.ts app/admin/project-operations/overview/page.tsx app/admin/project-operations/layout.tsx app/admin/workflow/page.tsx app/admin/project-operations/project-workflow/page.tsx
      - name: Run Workflow regression tests
        run: node --test tests/workflow-upgrade.test.cjs
      - name: Verify production build
        run: npm run build
