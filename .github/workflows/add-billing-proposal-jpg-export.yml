name: Add billing and proposal JPG export

on:
  push:
    paths:
      - "scripts/apply_billing_proposal_jpg_export.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply JPG export changes
        run: python scripts/apply_billing_proposal_jpg_export.py
      - name: Commit JPG export changes
        run: |
          if git diff --quiet -- app/admin/finance/invoices/page.tsx components/proposal-workspace.tsx lib/save-document-jpg.ts; then
            echo "No JPG export changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/finance/invoices/page.tsx components/proposal-workspace.tsx lib/save-document-jpg.ts
          git commit -m "Add JPG export to billing and proposals"
          git push origin main
