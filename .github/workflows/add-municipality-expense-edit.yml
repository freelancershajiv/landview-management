# Triggered patch workflow
name: Add Municipality expense editing

on:
  push:
    paths:
      - '.github/workflows/add-municipality-expense-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add admin-only Municipality expense editing
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=1):
              p=Path(path)
              s=p.read_text()
              found=s.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:140]!r}")
              p.write_text(s.replace(old,new))
              print(f"Updated {path}: {found} replacement(s)")

          route='app/api/municipality-file-pass/route.ts'
          replace_required(route,
            'import { normalizeProjectCode, roleOf, selectRows, insertRows } from "@/lib/supabase-data";',
            'import { normalizeProjectCode, roleOf, selectRows, insertRows, updateRows } from "@/lib/supabase-data";')
          replace_required(route,
            '    await requireFinanceUser(request);\n    const [transactions, projects, accounts] = await Promise.all([',
            '    const user = await requireFinanceUser(request);\n    const [transactions, projects, accounts, expenses] = await Promise.all([')
          replace_required(route,
            '      selectRows("accounts", { order: "account_name:asc", limit: 1000 }),\n    ]);',
            '      selectRows("accounts", { order: "account_name:asc", limit: 1000 }),\n      selectRows("expenses", { filters: { finance_scope: MUNICIPALITY_SCOPE }, limit: 5000 }),\n    ]);')
          replace_required(route,
            '    const accountMap = new Map(accounts.map((row) => [row.id, row.account_name || row.account_code]));',
            '    const accountMap = new Map(accounts.map((row) => [row.id, row.account_name || row.account_code]));\n    const expenseMap = new Map(expenses.map((row) => [row.expense_code, row]));')
          replace_required(route,
            '          const isTransfer = sourceType === "MUNICIPALITY_TRANSFER_OUT";\n          return {',
            '          const isTransfer = sourceType === "MUNICIPALITY_TRANSFER_OUT";\n          const sourceExpense = sourceType === "EXPENSE" ? expenseMap.get(row.source_id) : undefined;\n          return {')
          replace_required(route,
            '            id: row.transaction_code,\n            date: row.transaction_date || "",',
            '            id: row.transaction_code,\n            sourceId: row.source_id || "",\n            date: row.transaction_date || "",')
          replace_required(route,
            '            reference: row.reference_no || "",\n            createdBy: row.source_created_by || "",',
            '            reference: row.reference_no || "",\n            paidTo: sourceExpense?.paid_to || "",\n            notes: sourceExpense?.notes || "",\n            createdBy: row.source_created_by || "",')
          replace_required(route,
            '      data: {\n        transactions: transactions.map((row) => {',
            '      data: {\n        canEditExpenses: roleOf(user) === "admin",\n        transactions: transactions.map((row) => {')

          marker='    if (action === "sendToMainLedger") {'
          insert='''    if (action === "updateExpense") {
      if (roleOf(user) !== "admin") {
        return NextResponse.json({ success: false, error: "Admin access is required to edit Municipality expenses." }, { status: 403 });
      }
      const sourceId = text(body.Source_ID || body.sourceId, 160);
      if (!sourceId) return NextResponse.json({ success: false, error: "Municipality expense source ID is required." }, { status: 400 });
      const existingRows = await selectRows("expenses", { filters: { expense_code: sourceId }, limit: 1 });
      const existing = existingRows[0];
      if (!existing || text(existing.finance_scope) !== MUNICIPALITY_SCOPE) {
        return NextResponse.json({ success: false, error: "Municipality expense was not found." }, { status: 404 });
      }
      const value = num(body.Amount || body.amount);
      if (!(value > 0)) return NextResponse.json({ success: false, error: "Enter a valid expense amount." }, { status: 400 });
      const date = text(body.Expense_Date || body.date, 20) || dhakaToday();
      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) return NextResponse.json({ success: false, error: "Choose a valid expense date." }, { status: 400 });
      const account = text(body.Account || body.Payment_Method || body.account, 160);
      if (!account) return NextResponse.json({ success: false, error: "Choose the account the expense was paid from." }, { status: 400 });
      const changes = {
        project_id: projects[0].id,
        expense_date: date,
        file_id: projectCode,
        project_name_snapshot: projects[0].project_name || null,
        category: text(body.Category || body.category, 200) || "Municipality Fee",
        description: text(body.Description || body.description, 1000) || "Municipality expense",
        amount: value,
        paid_to: text(body.Paid_To || body.paidTo, 250) || null,
        payment_method: account,
        reference_no: text(body.Reference_No || body.reference, 300) || null,
        notes: text(body.Notes || body.notes, 1000) || null,
        approved_by_code: actor,
        approved_at: new Date().toISOString(),
        service_type: "Municipality Accounts",
        finance_scope: MUNICIPALITY_SCOPE,
      };
      const saved = await updateRows("expenses", { expense_code: sourceId }, changes);
      if (!saved.length) throw new Error("Municipality expense update did not return a saved row.");
      return NextResponse.json({ success: true, data: saved[0] }, { headers: { "Cache-Control": "no-store", "X-Landview-Data": "supabase" } });
    }

'''
          replace_required(route, marker, insert+marker)

          page='app/admin/municipality-accounts/page.tsx'
          replace_required(page,
            '  id: string;\n  date: string;',
            '  id: string;\n  sourceId: string;\n  date: string;')
          replace_required(page,
            '  reference: string;\n  createdBy: string;',
            '  reference: string;\n  paidTo: string;\n  notes: string;\n  createdBy: string;')
          replace_required(page,
            'type LoadData = { transactions: LedgerRow[]; projects: ProjectOption[]; accounts: AccountOption[] };',
            'type LoadData = { transactions: LedgerRow[]; projects: ProjectOption[]; accounts: AccountOption[]; canEditExpenses?: boolean };')
          replace_required(page,
            '  const [expenseOpen, setExpenseOpen] = useState(false);\n  const [saving, setSaving] = useState(false);',
            '  const [expenseOpen, setExpenseOpen] = useState(false);\n  const [editSourceId, setEditSourceId] = useState("");\n  const [saving, setSaving] = useState(false);')
          replace_required(page,
            '    const term = query.trim().toLowerCase();\n    return [...data.transactions]\n      .filter((row) => !term || [row.id, row.date, row.projectId, row.category, row.description, row.account, row.reference, row.createdBy].join(" ").toLowerCase().includes(term))',
            '    const term = query.trim().toLowerCase();\n    return [...data.transactions]\n      .filter((row) => !term || [row.id, row.sourceId, row.date, row.projectId, row.category, row.description, row.account, row.reference, row.paidTo, row.notes, row.createdBy].join(" ").toLowerCase().includes(term))')
          replace_required(page,
            '          action: "addExpense",\n          Project_ID: expense.projectId,',
            '          action: editSourceId ? "updateExpense" : "addExpense",\n          Source_ID: editSourceId || undefined,\n          Project_ID: expense.projectId,')
          replace_required(page,
            '      setExpenseOpen(false);\n      setExpense(blankExpense(data.accounts[0]?.name || ""));\n      setMessage(`Municipality expense for ${expense.projectId} added successfully.`);',
            '      setExpenseOpen(false);\n      setExpense(blankExpense(data.accounts[0]?.name || ""));\n      setMessage(editSourceId ? `Municipality expense ${editSourceId} updated successfully.` : `Municipality expense for ${expense.projectId} added successfully.`);\n      setEditSourceId("");')
          replace_required(page,
            '  async function sendToMain(project: ProjectSummary) {',
            '''  function openExpenseEditor(row: LedgerRow) {
    if (!data.canEditExpenses || row.type !== "Expense" || row.sourceType !== "EXPENSE" || !row.sourceId) return;
    setMessage("");
    setFormError("");
    setEditSourceId(row.sourceId);
    setExpense({
      projectId: row.projectId,
      date: row.date,
      category: row.category || "Municipality Fee",
      description: row.description || "",
      amount: String(row.debit || ""),
      paidTo: row.paidTo || "",
      account: row.account || row.method || data.accounts[0]?.name || "",
      reference: row.reference || "",
      notes: row.notes || "",
    });
    setExpenseOpen(true);
  }

  async function sendToMain(project: ProjectSummary) {''')
          replace_required(page,
            'setExpense(blankExpense(data.accounts[0]?.name || "")); setExpenseOpen(true);',
            'setEditSourceId(""); setExpense(blankExpense(data.accounts[0]?.name || "")); setExpenseOpen(true);')
          replace_required(page,
            '<th className="num">Income</th><th>Added By</th></tr></thead>',
            '<th className="num">Income</th><th>Added By</th><th>Action</th></tr></thead>')
          replace_required(page,
            '<td>{row.createdBy || "—"}</td></tr>)}</tbody>',
            '<td>{row.createdBy || "—"}</td><td>{data.canEditExpenses && row.type === "Expense" && row.sourceType === "EXPENSE" && row.sourceId ? <button type="button" className="mun-btn" onClick={() => openExpenseEditor(row)}>Edit</button> : "—"}</td></tr>)}</tbody>')
          replace_required(page,
            '<div className="mun-modal" role="dialog" aria-modal="true" aria-label="Add Municipality Expense"><h2>Add Municipality Expense</h2><p>This expense stays inside Municipality Accounts and reduces that project&apos;s remaining municipality balance.</p>',
            '<div className="mun-modal" role="dialog" aria-modal="true" aria-label={editSourceId ? "Edit Municipality Expense" : "Add Municipality Expense"}><h2>{editSourceId ? "Edit Municipality Expense" : "Add Municipality Expense"}</h2><p>{editSourceId ? "Admin edit mode: saving updates the original Municipality expense and recalculates its ledger transaction and project balance." : "This expense stays inside Municipality Accounts and reduces that project&apos;s remaining municipality balance."}</p>')
          replace_required(page,
            '<button className="mun-btn primary" disabled={saving} onClick={() => void saveExpense()}>{saving ? "Saving…" : "Save Expense"}</button>',
            '<button className="mun-btn primary" disabled={saving} onClick={() => void saveExpense()}>{saving ? "Saving…" : editSourceId ? "Save Changes" : "Save Expense"}</button>')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/add-municipality-expense-edit.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow admins to edit municipality expenses"
          git push
