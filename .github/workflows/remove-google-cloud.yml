name: Remove Google Cloud integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-google-cloud.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove OIDC package from package files
        run: npm uninstall @vercel/oidc --save
      - name: Remove one-time cleanup workflow
        run: git rm .github/workflows/remove-google-cloud.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/remove-google-cloud.yml
          git commit -m "Remove Google Cloud OIDC dependency"
          git push
