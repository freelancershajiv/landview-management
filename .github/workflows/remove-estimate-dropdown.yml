name: Remove Estimate Navigation Dropdown

on:
  push:
    paths:
      - '.github/workflows/remove-estimate-dropdown.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Estimates a direct navigation link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/management-shell-v2.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('  const [estimateOpen, setEstimateOpen] = useState(false);\n', '')
          text = text.replace(
              '  useEffect(() => {\n    setMobileOpen(false);\n    setEstimateOpen(false);\n  }, [pathname]);',
              '  useEffect(() => {\n    setMobileOpen(false);\n  }, [pathname]);'
          )

          nav_pattern = re.compile(
              r'\s*\{orderedVisibleNav\.map\(\(item\) => \{\s*'
              r'const active = currentMatches\(pathname, item\.href\);\s*'
              r'if\(item\.href !== "/admin/estimate"\).*?'
              r'\}\)\}',
              re.S,
          )
          nav_replacement = '''
          {orderedVisibleNav.map((item) => {
            const active = currentMatches(pathname, item.href);
            return <Link key={item.href} href={item.href} aria-current={active ? "page" : undefined} className={active ? "active" : ""} onClick={() => setMobileOpen(false)}><span className="nav-icon" aria-hidden="true">{item.icon}</span><span>{item.label}</span></Link>;
          })}'''
          text, replaced = nav_pattern.subn(nav_replacement, text, count=1)
          if replaced != 1:
              raise SystemExit(f'Expected exactly one Estimates dropdown block; found {replaced}.')

          # Preserve the direct-link mobile rule while removing dropdown-only selectors/rules.
          text = text.replace(',.portal-admin .primary-nav.open .estimate-nav-trigger', '')
          text = '\n'.join(
              line for line in text.split('\n')
              if 'estimate-nav-wrap' not in line
              and 'estimate-nav-trigger' not in line
              and 'estimate-nav-menu' not in line
          )

          if 'estimateOpen' in text or 'setEstimateOpen' in text:
              raise SystemExit('Dropdown state still exists after patch.')
          if 'estimate-nav-' in text:
              raise SystemExit('Dropdown-only CSS still exists after patch.')
          if 'href: "/admin/estimate", label: "Estimates"' not in text:
              raise SystemExit('Estimates navigation item is missing after patch.')
          if 'return <Link key={item.href} href={item.href}' not in text:
              raise SystemExit('Direct navigation link renderer is missing after patch.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'href: "/admin/estimate", label: "Estimates"' components/management-shell-v2.tsx
          ! grep -q 'estimateOpen\|estimate-nav-menu\|estimate-nav-trigger\|estimate-nav-wrap' components/management-shell-v2.tsx

      - name: Commit navigation cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/management-shell-v2.tsx
          git commit -m 'fix: make Estimates a direct navigation link'
          git push
