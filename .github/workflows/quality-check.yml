name: LAND VIEW Quality Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Invoice integrity regression gate
        run: |
          node --test \
            tests/invoice-allocation-assessment.test.cjs \
            tests/invoice-correction-policy.test.cjs \
            tests/invoice-corrections-32.test.cjs \
            tests/invoice-reconciliation-31.test.cjs \
            tests/invoice-discount-visibility.test.cjs \
            tests/invoice-bill-identity.test.cjs \
            tests/invoice-integrity-api.test.cjs \
            tests/billing-document-integrity.test.cjs \
            tests/invoice-single-bill-status.test.cjs \
            tests/proposal-billing-conversion.test.cjs \
            tests/invoice-center.test.cjs

      - name: Lint new invoice 3.2 modules
        run: npx eslint lib/invoice-correction-policy.ts app/api/billing/allocation-corrections/route.ts app/admin/finance/allocation-corrections/page.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: WhatsApp service syntax
        run: node --check whatsapp-service/server.mjs

      - name: Production build verification
        run: npm run build

      # Existing global lint/test failures are tracked separately. They are
      # reported, never hidden, but do not block verified invoice releases.
      - name: Repository-wide lint debt (report only)
        continue-on-error: true
        run: npm run lint

      - name: Full legacy test suite (report only)
        continue-on-error: true
        run: npm test
