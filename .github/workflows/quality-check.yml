name: LAND VIEW Quality Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Invoice integrity regression gate
        run: |
          node --test \
            tests/invoice-allocation-assessment.test.cjs \
            tests/invoice-correction-policy.test.cjs \
            tests/invoice-corrections-32.test.cjs \
            tests/invoice-reconciliation-31.test.cjs \
            tests/invoice-discount-visibility.test.cjs \
            tests/invoice-bill-identity.test.cjs \
            tests/invoice-integrity-api.test.cjs \
            tests/billing-document-integrity.test.cjs \
            tests/invoice-single-bill-status.test.cjs \
            tests/proposal-billing-conversion.test.cjs \
            tests/invoice-center.test.cjs

      - name: Lint new invoice 3.2 modules
        run: npx eslint lib/invoice-correction-policy.ts app/api/billing/allocation-corrections/route.ts app/admin/finance/allocation-corrections/page.tsx

      - name: Billing V4 migration-free reliability gate
        run: node --test tests/billing-v4-reliability.test.cjs

      - name: Billing 4.1 reconciliation review gate
        run: node --test tests/billing-reconciliation-41.test.cjs

      - name: Billing 4.1 scoped lint
        run: npx eslint lib/billing-reconciliation-41.ts app/api/billing/reconciliation-41/route.ts app/admin/finance/reconciliation/page.tsx

      - name: Billing V4 route/server lint
        run: npx eslint app/api/billing/batch/route.ts app/api/billing/submission-status/route.ts components/billing-navigation.tsx components/billing-project-jump.tsx

      - name: Mobile V5 and centralized control regression gate
        run: node --test tests/mobile-management-responsive.test.cjs tests/mobile-v5-dashboard.test.cjs tests/mobile-v53-projects-finance.test.cjs tests/private-control-system.test.cjs tests/project-management-categories.test.cjs tests/site-visit-mobile-v54.test.cjs tests/mobile-v55-portals.test.cjs tests/mobile-sidebar-v56.test.cjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: WhatsApp service syntax
        run: node --check whatsapp-service/server.mjs

      - name: Production build verification
        run: npm run build

      # Existing global lint/test failures are tracked separately. They are
      # reported, never hidden, but do not block verified invoice releases.
      - name: Repository-wide lint debt (report only)
        continue-on-error: true
        run: npm run lint

      - name: Full legacy test suite (report only)
        continue-on-error: true
        run: npm test
