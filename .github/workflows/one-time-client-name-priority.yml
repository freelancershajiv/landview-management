name: One-time client-name billing display patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-client-name-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make client name primary in Billing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/admin/finance/page.tsx')
          s = p.read_text()

          replacements = [
            (
              '<thead><tr><th>File ID</th><th>Project / Client</th>',
              '<thead><tr><th>File ID</th><th>Client / Project</th>'
            ),
            (
              '<td className="billing-project-cell"><strong>{row.projectName || row.projectId}</strong><span className="billing-client-line">{row.clientName || "—"}</span>',
              '<td className="billing-project-cell"><strong>{row.clientName || row.projectName || row.projectId}</strong><span className="billing-client-line">{row.projectName && row.projectName !== row.clientName ? row.projectName : "—"}</span>'
            ),
            (
              '{p.id} — {p.projectName}{p.clientName ? ` — ${p.clientName}` : ""}',
              '{p.id} — {p.clientName || p.projectName}{p.projectName && p.projectName !== p.clientName ? ` — ${p.projectName}` : ""}'
            ),
            (
              '{p.id} — {p.projectName} — Due {money(p.due)}',
              '{p.id} — {p.clientName || p.projectName} — Due {money(p.due)}'
            ),
            (
              '{p.id} — {p.projectName} — Written off {money(p.writtenOff)}',
              '{p.id} — {p.clientName || p.projectName} — Written off {money(p.writtenOff)}'
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source text not found: {old[:120]}')
            s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-client-name-priority.yml
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/admin/finance/page.tsx .github/workflows/one-time-client-name-priority.yml
          git commit -m "Prioritize client names in billing displays"
          git push origin main
