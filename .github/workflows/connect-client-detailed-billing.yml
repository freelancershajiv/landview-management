name: Connect client detailed billing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-client-detailed-billing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace simplified invoice actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/client/page.tsx')
          s = p.read_text()
          old = 'onClick={()=>project&&printInvoice(project)}'
          new = 'onClick={()=>project&&(window.location.href=`/client/billing/${encodeURIComponent(project.projectId)}`)}'
          count = s.count(old)
          if count == 0:
              print('Detailed billing actions already connected or source changed.')
          else:
              s = s.replace(old, new)
              p.write_text(s)
              print(f'Replaced {count} client invoice action(s).')
          PY
      - name: Commit client billing navigation
        run: |
          if git diff --quiet -- app/client/page.tsx; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/client/page.tsx
          git commit -m "Open detailed billing PDF from client portal"
          git push origin main
