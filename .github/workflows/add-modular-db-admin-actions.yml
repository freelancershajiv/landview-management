name: Add modular database admin actions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-modular-db-admin-actions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add admin migration actions to Code.gs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Code.gs')
          s = p.read_text()
          marker = '''    case "getSession":\n      return getSession(params);\n'''
          replacement = marker + '''\n    case "getModularDatabaseStatus":\n      return getModularDatabaseStatus_(params);\n\n    case "migrateModularDatabases":\n      return migrateModularDatabases(params);\n\n    case "disableModularDatabases":\n      return disableModularDatabases(params);\n'''
          if 'case "migrateModularDatabases"' not in s:
              if marker not in s:
                  raise SystemExit('Could not find getSession action marker')
              s = s.replace(marker, replacement, 1)
              p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/add-modular-db-admin-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs
          git commit -m "Expose modular database admin actions"
          git push
