name: One-time proposal conversion and billing patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-proposal-billing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch proposal conversion and billing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # 1) Proposal conversion must create the actual project before marking the proposal Converted.
          replace(
              "app/api/landview/route.ts",
              '''  if (op === "convert") {
              if (!await hasPermission(user, "proposals.convert")) throw new Error("Permission required: proposals.convert");
              const projectId = normalizeProjectCode(input.projectId || input.Project_ID || input.convertedProjectId || "");
              await updateRows("proposals", { proposal_code: id }, { status: "Converted", converted_project_code: projectId || null, updated_at: new Date().toISOString() });
              return proposalBundle(id);
            }''',
              '''  if (op === "convert") {
              if (!await hasPermission(user, "proposals.convert")) throw new Error("Permission required: proposals.convert");
              const projectId = normalizeProjectCode(input.projectId || input.Project_ID || input.convertedProjectId || "");
              if (!projectId) throw new Error("A valid Project ID is required, for example LV-281.");
              const current = await proposalBundle(id);
              const proposal = current.proposal as Row;
              const existingProjects = await selectRows("projects", { filters: { project_code: projectId }, limit: 1 });
              if (existingProjects.length && text(existingProjects[0].reclassified_proposal_code) !== id) {
                throw new Error(`${projectId} already exists. Choose an unused Project ID.`);
              }
              const now = new Date().toISOString();
              if (!existingProjects.length) {
                const rawPlot = text(proposal.Plot_Area);
                const rawFloors = text(proposal.Floors);
                const plot = rawPlot ? num(rawPlot) : null;
                const floors = rawFloors ? Math.trunc(num(rawFloors)) : null;
                await insertRows("projects", {
                  project_code: projectId,
                  project_name: text(proposal.Project_Title) || text(proposal.Client_Name) || projectId,
                  client_name_snapshot: text(proposal.Client_Name) || null,
                  phone_number_snapshot: text(proposal.Phone) || null,
                  project_type: text(proposal.Project_Type) || null,
                  location: text(proposal.Project_Location) || null,
                  plot_area: plot !== null && plot >= 0 ? plot : null,
                  floors: floors !== null && floors >= 0 ? floors : null,
                  project_area_text: rawPlot || null,
                  number_of_stories_text: rawFloors || null,
                  start_date: now.slice(0, 10),
                  design_bill: 0,
                  status: "Running",
                  notes: `Converted from proposal ${id}${text(proposal.Notes) ? `\\n${text(proposal.Notes)}` : ""}`,
                  public_display: false,
                  record_type: "project",
                  reclassified_proposal_code: id,
                  created_at: now,
                  updated_at: now,
                });
              }
              await updateRows("proposals", { proposal_code: id }, { status: "Converted", converted_project_code: projectId, updated_at: now });
              const prior = await selectRows("proposal_activity", { filters: { proposal_code: id, action: "Converted to Project", reference: projectId }, limit: 1 });
              if (!prior.length) {
                await insertRows("proposal_activity", {
                  activity_code: randomCode("PA"), proposal_code: id, prospect_code: text(proposal.Prospect_ID) || null,
                  action: "Converted to Project", from_status: text(proposal.Status) || "Accepted", to_status: "Converted",
                  performed_by: text(user.name || user.Name) || userIdOf(user), performed_at: now,
                  details: `Created project ${projectId} from accepted proposal.`, user_key: userIdOf(user), role: roleOf(user), reference: projectId,
                });
              }
              return proposalBundle(id);
            }'''
          )

          # 2) Design Books is a real billing category throughout the Billing workspace.
          replace(
              "app/admin/finance/page.tsx",
              'const BILL_CATEGORIES = ["Engineering Bill", "Supervision Bill", "Other Services Bill"] as const;\ntype BillCategory = typeof BILL_CATEGORIES[number];\ntype BillingFilter = "due" | "paid" | "written" | "all";\ntype CategoryDueFilter = "all" | "eb" | "sb" | "ob";',
              'const BILL_CATEGORIES = ["Engineering Bill", "Design Books", "Supervision Bill", "Other Services Bill"] as const;\ntype BillCategory = typeof BILL_CATEGORIES[number];\ntype BillingFilter = "due" | "paid" | "written" | "all";\ntype CategoryDueFilter = "all" | "eb" | "db" | "sb" | "ob";'
          )
          replace(
              "app/admin/finance/page.tsx",
              '''const CATEGORY_DUE_FILTERS = [
            { key: "eb", label: "EB Due", category: "Engineering Bill" },
            { key: "sb", label: "SB Due", category: "Supervision Bill" },
            { key: "ob", label: "OB Due", category: "Other Services Bill" },
          ] as const;''',
              '''const CATEGORY_DUE_FILTERS = [
            { key: "eb", label: "EB Due", category: "Engineering Bill" },
            { key: "db", label: "DB Due", category: "Design Books" },
            { key: "sb", label: "SB Due", category: "Supervision Bill" },
            { key: "ob", label: "OB Due", category: "Other Services Bill" },
          ] as const;'''
          )
          replace(
              "app/admin/finance/page.tsx",
              '''function canonicalCategoryKey(key: string, category: BillCategory) {
            const normalized = normalizeStatus(key);
            if (category === "Engineering Bill") return normalized === "engineering bill" || normalized === "engineering" || normalized === "design bill";
            if (category === "Supervision Bill") return normalized === "supervision bill" || normalized === "supervision";
            return normalized === "other services bill" || normalized === "others bill" || normalized === "other services" || normalized === "others";
          }''',
              '''function canonicalCategoryKey(key: string, category: BillCategory) {
            const normalized = normalizeStatus(key);
            if (category === "Design Books") return normalized === "design books" || normalized === "design book";
            if (category === "Engineering Bill") return normalized === "engineering bill" || normalized === "engineering" || normalized === "design bill";
            if (category === "Supervision Bill") return normalized === "supervision bill" || normalized === "supervision";
            return normalized === "other services bill" || normalized === "others bill" || normalized === "other services" || normalized === "others";
          }'''
          )
          replace(
              "app/admin/finance/page.tsx",
              '      eb: billingProjects.filter((row) => projectCategory(row, "Engineering Bill").due > 0.009).length,\n      sb:',
              '      eb: billingProjects.filter((row) => projectCategory(row, "Engineering Bill").due > 0.009).length,\n      db: billingProjects.filter((row) => projectCategory(row, "Design Books").due > 0.009).length,\n      sb:'
          )
          replace(
              "app/admin/finance/page.tsx",
              '.billing-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));',
              '.billing-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));'
          )
          replace(
              "app/admin/finance/page.tsx",
              '          const eb = projectCategory(row, "Engineering Bill"), sb = projectCategory(row, "Supervision Bill"), ob = projectCategory(row, "Other Services Bill");',
              '          const eb = projectCategory(row, "Engineering Bill"), db = projectCategory(row, "Design Books"), sb = projectCategory(row, "Supervision Bill"), ob = projectCategory(row, "Other Services Bill");'
          )
          replace(
              "app/admin/finance/page.tsx",
              '[["EB",eb],["SB",sb],["OB",ob]]',
              '[["EB",eb],["DB",db],["SB",sb],["OB",ob]]'
          )
          replace(
              "app/admin/finance/page.tsx",
              '<td><span className={`billing-status ${statusClass}`}>{status}</span></td><td><Link className="billing-btn" href={`/admin/finance/invoices?fileId=${encodeURIComponent(normalizeProjectId(row.projectId))}`}>Open</Link></td>',
              '<td><span className={`billing-status ${statusClass}`}>{status}</span></td><td><div className="billing-row-actions"><Link className="billing-btn" href={`/admin/finance/invoices?fileId=${encodeURIComponent(normalizeProjectId(row.projectId))}`}>Open</Link><Link className="billing-btn" href={`/admin/finance/bills?fileId=${encodeURIComponent(normalizeProjectId(row.projectId))}`}>Edit bills</Link></div></td>'
          )
          replace(
              "app/admin/finance/page.tsx",
              '.billing-table tbody tr:hover{background:#151f27}.billing-project-cell{',
              '.billing-table tbody tr:hover{background:#151f27}.billing-row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.billing-project-cell{'
          )

          # 3) Canonical Supabase aggregation must preserve Design Books rather than folding it into Engineering.
          replace(
              "lib/supabase-data.ts",
              '''function categoryOf(row: Row) {
            const raw = text(row.billing_category || row.category || row.payment_for || row.income_category || row.description).toLowerCase();
            if (/supervision/.test(raw)) return "Supervision Bill";
            if (/other|soil|survey|municipality|file pass/.test(raw)) return "Other Services Bill";
            return "Engineering Bill";
          }''',
              '''function categoryOf(row: Row) {
            const raw = text(row.billing_category || row.category || row.payment_for || row.income_category || row.description).toLowerCase();
            if (/design\\s*books?/.test(raw)) return "Design Books";
            if (/supervision/.test(raw)) return "Supervision Bill";
            if (/other|soil|survey|municipality|file pass/.test(raw)) return "Other Services Bill";
            return "Engineering Bill";
          }'''
          )

          # 4) Project billing endpoint gets dedicated Design Books bill/deposit sheets.
          replace(
              "app/api/project-billing/route.ts",
              'type Category = "Engineering Bill" | "Supervision Bill" | "Other Services Bill";\nconst TABS = ["Summary","File List","Design Bill","Design Deposit","Supervision Bill","S Deposit","Others Bill","Others Bill Deposit"];',
              'type Category = "Engineering Bill" | "Design Books" | "Supervision Bill" | "Other Services Bill";\nconst TABS = ["Summary","File List","Design Bill","Design Deposit","Design Books Bill","Design Books Deposit","Supervision Bill","S Deposit","Others Bill","Others Bill Deposit"];'
          )
          replace(
              "app/api/project-billing/route.ts",
              '  if(/supervision/.test(source)) return "Supervision Bill";',
              '  if(/design\\s*books?/.test(source)) return "Design Books";\n  if(/supervision/.test(source)) return "Supervision Bill";'
          )
          replace(
              "app/api/project-billing/route.ts",
              '      "Engineering Bill":{bills:[],payments:[],gross:0,discount:0,paid:0,due:0},\n      "Supervision Bill":',
              '      "Engineering Bill":{bills:[],payments:[],gross:0,discount:0,paid:0,due:0},\n      "Design Books":{bills:[],payments:[],gross:0,discount:0,paid:0,due:0},\n      "Supervision Bill":'
          )
          replace(
              "app/api/project-billing/route.ts",
              '    const eng=groups["Engineering Bill"],sup=groups["Supervision Bill"],oth=groups["Other Services Bill"];\n    const totalDue=eng.due+sup.due+oth.due,totalBilled=eng.gross-eng.discount+sup.gross-sup.discount+oth.gross-oth.discount;',
              '    const eng=groups["Engineering Bill"],books=groups["Design Books"],sup=groups["Supervision Bill"],oth=groups["Other Services Bill"];\n    const totalDue=eng.due+books.due+sup.due+oth.due,totalBilled=eng.gross-eng.discount+books.gross-books.discount+sup.gross-sup.discount+oth.gross-oth.discount;'
          )
          replace(
              "app/api/project-billing/route.ts",
              'sheet("Summary",["FILE ID","Client Name","Project Name","Engineering Bill","Engineering Discount","Engineering Deposit","Engineering Due","Supervision Bill","Supervision Discount","Supervision Deposit","Supervision Due","Other Services Bill","Other Services Discount","Other Services Deposit","Other Services Due","Total Due","Status"],[[projectId,project.Client_Name||"",project.Project_Name||"",eng.gross,eng.discount,eng.paid,eng.due,sup.gross,sup.discount,sup.paid,sup.due,oth.gross,oth.discount,oth.paid,oth.due,totalDue,totalDue>.009?"DUE":totalBilled>0?"FULL PAID":""]]),',
              'sheet("Summary",["FILE ID","Client Name","Project Name","Engineering Bill","Engineering Discount","Engineering Deposit","Engineering Due","Supervision Bill","Supervision Discount","Supervision Deposit","Supervision Due","Other Services Bill","Other Services Discount","Other Services Deposit","Other Services Due","Design Books Bill","Design Books Discount","Design Books Deposit","Design Books Due","Total Due","Status"],[[projectId,project.Client_Name||"",project.Project_Name||"",eng.gross,eng.discount,eng.paid,eng.due,sup.gross,sup.discount,sup.paid,sup.due,oth.gross,oth.discount,oth.paid,oth.due,books.gross,books.discount,books.paid,books.due,totalDue,totalDue>.009?"DUE":totalBilled>0?"FULL PAID":""]]),'
          )
          replace(
              "app/api/project-billing/route.ts",
              '      sheet("Design Deposit",["FILE ID","Date","Details","Amount","Verification","Income ID"],payRows("Engineering Bill")),\n      sheet("Supervision Bill",',
              '      sheet("Design Deposit",["FILE ID","Date","Details","Amount","Verification","Income ID"],payRows("Engineering Bill")),\n      sheet("Design Books Bill",["FILE ID","Service Name","Rate (BDT)","QTY","Amount (BDT)","Bill ID"],billRows("Design Books")),\n      sheet("Design Books Deposit",["FILE ID","Date","Details","Amount","Verification","Income ID"],payRows("Design Books")),\n      sheet("Supervision Bill",'
          )

          # 5) Invoice construction/verification supports the new category.
          replace(
              "lib/sheet-invoices.ts",
              'export const invoiceTabs = ["Summary", "File List", "Design Bill", "Design Deposit", "Supervision Bill", "S Deposit", "Others Bill", "Others Bill Deposit"];',
              'export const invoiceTabs = ["Summary", "File List", "Design Bill", "Design Deposit", "Design Books Bill", "Design Books Deposit", "Supervision Bill", "S Deposit", "Others Bill", "Others Bill Deposit"];'
          )
          replace(
              "lib/sheet-invoices.ts",
              '    { name: "Engineering", bill: "Design Bill", deposit: "Design Deposit", discountIndex: 4 },\n    { name: "Supervision",',
              '    { name: "Engineering", bill: "Design Bill", deposit: "Design Deposit", discountIndex: 4 },\n    { name: "Design Books", bill: "Design Books Bill", deposit: "Design Books Deposit", discountIndex: 16 },\n    { name: "Supervision",'
          )
          replace(
              "lib/sheet-invoices.ts",
              'type InvoiceCategoryName = "Engineering" | "Supervision" | "Others";',
              'type InvoiceCategoryName = "Engineering" | "Design Books" | "Supervision" | "Others";'
          )
          replace(
              "lib/sheet-invoices.ts",
              '  if (text === "engineering bill" || text === "engineering") return "Engineering";\n  if (text === "supervision bill"',
              '  if (text === "design books" || text === "design book") return "Design Books";\n  if (text === "engineering bill" || text === "engineering") return "Engineering";\n  if (text === "supervision bill"'
          )
          replace(
              "lib/sheet-invoices.ts",
              'replace(/^\\[(Engineering Bill|Supervision Bill|Other Services Bill)\\]\\s*/i, "")',
              'replace(/^\\[(Engineering Bill|Design Books|Supervision Bill|Other Services Bill)\\]\\s*/i, "")',
              count=1
          )
          replace(
              "lib/sheet-invoices.ts",
              'description.match(/^\\[(Engineering Bill|Supervision Bill|Other Services Bill)\\]\\s*/i)',
              'description.match(/^\\[(Engineering Bill|Design Books|Supervision Bill|Other Services Bill)\\]\\s*/i)'
          )
          replace(
              "lib/sheet-invoices.ts",
              'description.replace(/^\\[(Engineering Bill|Supervision Bill|Other Services Bill)\\]\\s*/i, "")',
              'description.replace(/^\\[(Engineering Bill|Design Books|Supervision Bill|Other Services Bill)\\]\\s*/i, "")'
          )

          # 6) Admin/accounting API for editing an already-issued bill without deleting payment history.
          api_path = Path("app/api/billing/bills/route.ts")
          api_path.parent.mkdir(parents=True, exist_ok=True)
          api_path.write_text(r'''import { NextRequest, NextResponse } from "next/server";
          import { requireLocalSession } from "@/lib/local-session";
          import { normalizeProjectCode, roleOf, selectRows, updateRows } from "@/lib/supabase-data";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          const EDIT_ROLES = new Set(["admin", "manager", "accounts"]);
          const BILL_CATEGORIES = new Set(["Engineering Bill", "Design Books", "Supervision Bill", "Other Services Bill"]);

          function sameOrigin(request: NextRequest) {
            const origin = request.headers.get("origin");
            if (!origin) return process.env.NODE_ENV !== "production" || request.headers.get("sec-fetch-site") === "same-origin";
            try { return new URL(origin).host === request.nextUrl.host; } catch { return false; }
          }
          function text(value: unknown, max = 1200) { return String(value ?? "").trim().slice(0, max); }
          function num(value: unknown) {
            const n = Number(text(value).replace(/,/g, "").replace(/[^0-9.-]/g, ""));
            return Number.isFinite(n) ? n : Number.NaN;
          }
          function date(value: unknown) {
            const v = text(value, 20);
            return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "";
          }

          export async function PATCH(request: NextRequest) {
            try {
              if (!sameOrigin(request)) return NextResponse.json({ success: false, error: "Invalid request origin." }, { status: 403 });
              const user = await requireLocalSession(request);
              if (!user) return NextResponse.json({ success: false, error: "Session expired." }, { status: 401 });
              if (!EDIT_ROLES.has(roleOf(user))) return NextResponse.json({ success: false, error: "Admin, manager or accounts access is required to edit billed items." }, { status: 403 });

              const body = await request.json() as Record<string, unknown>;
              const billId = text(body.Bill_ID || body.billId, 120);
              if (!billId) return NextResponse.json({ success: false, error: "Bill ID is required." }, { status: 400 });
              const found = await selectRows("bills", { filters: { bill_code: billId }, limit: 1 });
              if (!found.length) return NextResponse.json({ success: false, error: "Bill was not found." }, { status: 404 });
              const current = found[0];

              const projectCode = normalizeProjectCode(body.Project_ID || body.projectId || "");
              if (projectCode) {
                const projects = await selectRows("projects", { filters: { project_code: projectCode }, limit: 1 });
                if (!projects.length || projects[0].id !== current.project_id) return NextResponse.json({ success: false, error: "This bill does not belong to the selected project." }, { status: 409 });
              }

              const category = text(body.Billing_Category || body.Category || body.category, 80);
              if (!BILL_CATEGORIES.has(category)) return NextResponse.json({ success: false, error: "Choose a valid billing category." }, { status: 400 });
              const gross = num(body.Amount);
              const discount = num(body.Discount ?? 0);
              if (!(gross > 0)) return NextResponse.json({ success: false, error: "Enter a valid gross bill amount." }, { status: 400 });
              if (!Number.isFinite(discount) || discount < 0 || discount > gross) return NextResponse.json({ success: false, error: "Discount must be between zero and the gross bill amount." }, { status: 400 });
              const billDate = date(body.Bill_Date || body.Date);
              if (!billDate) return NextResponse.json({ success: false, error: "Enter a valid bill date." }, { status: 400 });
              const rawDescription = text(body.Description || body.Service || body.Particulars, 1000);
              const service = rawDescription.replace(/^\[(Engineering Bill|Design Books|Supervision Bill|Other Services Bill)\]\s*/i, "").trim();
              if (!service) return NextResponse.json({ success: false, error: "Service / description is required." }, { status: 400 });

              const now = new Date().toISOString();
              const rows = await updateRows("bills", { bill_code: billId }, {
                bill_date: billDate,
                billing_category: category,
                category,
                description: `[${category}] ${service}`,
                amount: gross,
                discount,
                net_amount: gross - discount,
                notes: text(body.Notes || body.notes, 2000) || null,
                source_updated_at: now,
                updated_at: now,
              });
              return NextResponse.json({ success: true, data: rows[0] || null }, { headers: { "Cache-Control": "no-store, max-age=0", "X-Landview-Data": "supabase" } });
            } catch (error) {
              const message = error instanceof Error ? error.message : "Could not edit the bill.";
              return NextResponse.json({ success: false, error: message }, { status: /session/i.test(message) ? 401 : 502, headers: { "Cache-Control": "no-store" } });
            }
          }
          '''.replace("          ", ""))

          # 7) Dedicated editor page for individual billed invoice items.
          page_path = Path("app/admin/finance/bills/page.tsx")
          page_path.parent.mkdir(parents=True, exist_ok=True)
          page_path.write_text(r'''"use client";

          import Link from "next/link";
          import { useEffect, useState } from "react";
          import { landViewApi } from "@/lib/api";

          const BILL_CATEGORIES = ["Engineering Bill", "Design Books", "Supervision Bill", "Other Services Bill"] as const;
          type BillCategory = typeof BILL_CATEGORIES[number];
          type BillRow = Record<string, unknown>;
          type EditForm = { billId: string; date: string; category: BillCategory; service: string; amount: string; discount: string; notes: string };

          function value(row: BillRow, key: string) { return String(row?.[key] ?? "").trim(); }
          function normalizeProjectId(raw: string) {
            const match = raw.trim().toUpperCase().match(/^(?:LV[\s_-]*)?0*(\d+)$/i);
            return match ? `LV-${Number(match[1])}` : "";
          }
          function money(input: unknown) {
            const n = Number(String(input ?? 0).replace(/,/g, "").replace(/[^0-9.-]/g, ""));
            return new Intl.NumberFormat("en-BD", { style: "currency", currency: "BDT", maximumFractionDigits: 2 }).format(Number.isFinite(n) ? n : 0);
          }
          function serviceText(input: unknown) {
            return String(input ?? "").replace(/^\[(Engineering Bill|Design Books|Supervision Bill|Other Services Bill)\]\s*/i, "").trim();
          }
          function categoryOf(row: BillRow): BillCategory {
            const raw = value(row, "Billing_Category") || value(row, "Category");
            return BILL_CATEGORIES.includes(raw as BillCategory) ? raw as BillCategory : "Engineering Bill";
          }

          export default function EditBillsPage() {
            const [projectId, setProjectId] = useState("");
            const [records, setRecords] = useState<BillRow[]>([]);
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState("");
            const [message, setMessage] = useState("");
            const [edit, setEdit] = useState<EditForm | null>(null);

            async function load(raw = projectId) {
              const id = normalizeProjectId(raw);
              if (!id) { setError("Enter a valid Project ID, for example LV-279."); return; }
              setProjectId(id); setLoading(true); setError(""); setMessage("");
              try { setRecords(await landViewApi.getBillingRecords(id)); }
              catch (e) { setError(e instanceof Error ? e.message : "Could not load billed items."); }
              finally { setLoading(false); }
            }

            useEffect(() => {
              const id = normalizeProjectId(new URLSearchParams(window.location.search).get("fileId") || "");
              if (id) void load(id);
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            function begin(row: BillRow) {
              setError(""); setMessage("");
              setEdit({
                billId: value(row, "Bill_ID"),
                date: value(row, "Bill_Date").slice(0, 10),
                category: categoryOf(row),
                service: serviceText(value(row, "Description")),
                amount: value(row, "Amount"),
                discount: value(row, "Discount") || "0",
                notes: value(row, "Notes"),
              });
            }

            async function save() {
              if (!edit) return;
              const gross = Number(edit.amount.replace(/,/g, ""));
              const discount = Number(edit.discount.replace(/,/g, ""));
              if (!edit.service.trim()) return setError("Service / description is required.");
              if (!(gross > 0)) return setError("Enter a valid gross amount.");
              if (!Number.isFinite(discount) || discount < 0 || discount > gross) return setError("Discount must be between zero and the gross amount.");
              setSaving(true); setError(""); setMessage("");
              try {
                const response = await fetch("/api/billing/bills", {
                  method: "PATCH", credentials: "same-origin", cache: "no-store",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ Bill_ID: edit.billId, Project_ID: projectId, Bill_Date: edit.date, Billing_Category: edit.category, Description: edit.service.trim(), Amount: gross, Discount: discount, Notes: edit.notes.trim() }),
                });
                const json = await response.json().catch(() => null);
                if (!response.ok || !json?.success) throw new Error(String(json?.error || "Could not update billed item."));
                setEdit(null); setMessage(`${edit.billId} updated. The generated invoice will use the revised values.`); await load(projectId);
              } catch (e) { setError(e instanceof Error ? e.message : "Could not update billed item."); }
              finally { setSaving(false); }
            }

            return <div className="bill-editor">
              <style>{`
                .bill-editor{color:#edf2f6}.be-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.be-head small{color:#ef6c66;font-weight:900;letter-spacing:.12em}.be-head h1{margin:5px 0 0;font-size:32px}.be-actions{display:flex;gap:7px;flex-wrap:wrap}.be-btn{border:1px solid #3b4852;background:#17222b;color:#eef2f5;border-radius:8px;padding:9px 12px;font-weight:850;text-decoration:none;cursor:pointer}.be-btn.primary{background:#d94b45;border-color:#d94b45;color:#fff}.be-btn:disabled{opacity:.5;cursor:not-allowed}.be-find{display:flex;gap:8px;align-items:end;padding:14px;border:1px solid #303b44;background:#101820;border-radius:10px;margin-bottom:14px}.be-find label{display:grid;gap:5px;flex:1;color:#8d9aa4;font-size:10px}.be-find input,.be-edit input,.be-edit select,.be-edit textarea{border:1px solid #36434d;border-radius:7px;background:#0a1117;color:#eef2f5;padding:10px}.be-msg,.be-error{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:11px}.be-msg{border:1px solid #315e45;background:#163023;color:#a8e6bb}.be-error{border:1px solid #73363a;background:#351b1d;color:#ffaaa5}.be-table{overflow:auto;border:1px solid #303b44;border-radius:10px}.be-table table{width:100%;border-collapse:collapse;min-width:950px}.be-table th,.be-table td{padding:10px 11px;border-bottom:1px solid #28323a;text-align:left;font-size:11px}.be-table th{color:#8f9aa3;text-transform:uppercase;font-size:9px;letter-spacing:.06em}.be-table tbody tr:hover{background:#131d25}.be-empty{padding:22px;text-align:center;color:#8996a0;border:1px solid #303b44;border-radius:10px}.be-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.be-edit{width:min(720px,100%);max-height:90vh;overflow:auto;border:1px solid #3a4650;border-radius:12px;background:#101820;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.be-edit h2{margin:0 0 4px}.be-edit p{margin:0 0 14px;color:#8996a0;font-size:10px}.be-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.be-grid label{display:grid;gap:5px;color:#8d9aa4;font-size:10px}.be-grid .full{grid-column:1/-1}.be-grid textarea{min-height:80px;resize:vertical}.be-summary{grid-column:1/-1;display:flex;justify-content:space-between;padding:10px 12px;border:1px solid #35414a;border-radius:8px}.be-edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:650px){.be-head,.be-find{align-items:stretch;flex-direction:column}.be-grid{grid-template-columns:1fr}.be-grid .full{grid-column:auto}}
              `}</style>
              <header className="be-head"><div><small>LAND VIEW / BILLING</small><h1>Edit Billed Invoice Items</h1></div><div className="be-actions"><Link className="be-btn" href="/admin/finance">← Billing</Link>{projectId&&<Link className="be-btn primary" href={`/admin/finance/invoices?fileId=${encodeURIComponent(projectId)}`}>Open invoice</Link>}</div></header>
              <div className="be-find"><label>Project / File ID<input value={projectId} onChange={(e)=>setProjectId(e.target.value)} placeholder="LV-279"/></label><button className="be-btn primary" disabled={loading} onClick={()=>void load()}>{loading?"Loading…":"Load billed items"}</button></div>
              {error&&<div className="be-error">{error}</div>}{message&&<div className="be-msg">{message}</div>}
              {!loading&&projectId&&records.length===0?<div className="be-empty">No billed items found for {projectId}.</div>:records.length>0&&<div className="be-table"><table><thead><tr><th>Bill ID</th><th>Date</th><th>Category</th><th>Description</th><th>Gross</th><th>Discount</th><th>Net</th><th>Status</th><th></th></tr></thead><tbody>{records.map((row)=><tr key={value(row,"Bill_ID")}><td><strong>{value(row,"Bill_ID")}</strong></td><td>{value(row,"Bill_Date")||"—"}</td><td>{value(row,"Billing_Category")||value(row,"Category")||"—"}</td><td>{serviceText(value(row,"Description"))||"—"}</td><td>{money(row.Amount)}</td><td>{money(row.Discount)}</td><td>{money(row.Net_Amount)}</td><td>{value(row,"Status")||"—"}</td><td><button className="be-btn" onClick={()=>begin(row)}>Edit</button></td></tr>)}</tbody></table></div>}
              {edit&&<div className="be-backdrop" onMouseDown={(e)=>{if(e.currentTarget===e.target&&!saving)setEdit(null)}}><section className="be-edit"><h2>Edit {edit.billId}</h2><p>Changes update the billed item in Supabase. Existing payment records remain untouched.</p><div className="be-grid"><label>Bill date<input type="date" value={edit.date} onChange={(e)=>setEdit({...edit,date:e.target.value})}/></label><label>Category<select value={edit.category} onChange={(e)=>setEdit({...edit,category:e.target.value as BillCategory})}>{BILL_CATEGORIES.map((item)=><option key={item}>{item}</option>)}</select></label><label className="full">Service / description<input value={edit.service} onChange={(e)=>setEdit({...edit,service:e.target.value})}/></label><label>Gross amount (BDT)<input inputMode="decimal" value={edit.amount} onChange={(e)=>setEdit({...edit,amount:e.target.value})}/></label><label>Discount (BDT)<input inputMode="decimal" value={edit.discount} onChange={(e)=>setEdit({...edit,discount:e.target.value})}/></label><div className="be-summary"><span>Net billed</span><strong>{money(Math.max(0,(Number(edit.amount.replace(/,/g,""))||0)-(Number(edit.discount.replace(/,/g,""))||0)))}</strong></div><label className="full">Notes<textarea value={edit.notes} onChange={(e)=>setEdit({...edit,notes:e.target.value})}/></label></div><div className="be-edit-actions"><button className="be-btn" disabled={saving} onClick={()=>setEdit(null)}>Cancel</button><button className="be-btn primary" disabled={saving} onClick={()=>void save()}>{saving?"Saving…":"Save changes"}</button></div></section></div>}
            </div>;
          }
          '''.replace("          ", ""))

          # Remove this one-time workflow from the resulting tree.
          Path(".github/workflows/one-time-proposal-billing-fix.yml").unlink()
          PY

      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix proposal conversion and editable billing"
          git push origin HEAD:main
