name: Build project-specific billing backend bundle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/project-billing-bundle.yml
      - scripts/patch_project_billing_bundle.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add single-request project billing bundle
        run: python3 scripts/patch_project_billing_bundle.py

      - name: Commit backend bundle
        run: |
          if git diff --quiet -- FinanceSheet.gs; then
            echo "FinanceSheet.gs already contains the project billing bundle"
            exit 0
          fi
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add FinanceSheet.gs
          git commit -m "Add single-request project billing backend"
          git push origin HEAD:main
