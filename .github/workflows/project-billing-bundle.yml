name: Build project-specific billing backend bundle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/project-billing-bundle.yml
      - scripts/patch_project_billing_bundle.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add single-request project billing bundle
        run: python3 scripts/patch_project_billing_bundle.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and type-check Next.js
        run: npm run build

      - name: Commit generated source if needed
        run: |
          if git diff --quiet -- FinanceSheet.gs package-lock.json; then
            echo "Generated backend and package lock are already current"
            exit 0
          fi
          git config user.name "LAND VIEW Automation"
          git config user.email "actions@users.noreply.github.com"
          git add FinanceSheet.gs package-lock.json
          git commit -m "Sync project billing backend and dependency lock"
          git push origin HEAD:main
