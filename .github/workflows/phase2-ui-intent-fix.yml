name: Phase 2 UI intent fixes

on:
  push:
    branches:
      - refactor/ui-system-cleanup-phase-2-20261024

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-system-cleanup-phase-2-20261024
          fetch-depth: 0

      - name: Refine token intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/login/page.tsx': [
              ('.lv-login .tab.active{border-color:var(--lv-brand-text);', '.lv-login .tab.active{border-color:var(--lv-brand-primary);'),
              ('.lv-login .field input:focus{border-color:var(--lv-brand-text);box-shadow:0 0 0 3px var(--lv-brand-soft)}', '.lv-login .field input:focus{border-color:var(--lv-brand-primary);box-shadow:0 0 0 3px var(--lv-brand-ring)}'),
              ('.lv-login .remember input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--lv-brand-text)}', '.lv-login .remember input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--lv-brand-primary)}'),
              ('.lv-login .pinfield:focus{border-color:var(--lv-brand-text)}', '.lv-login .pinfield:focus{border-color:var(--lv-brand-primary);box-shadow:0 0 0 3px var(--lv-brand-ring)}'),
              ('.lv-login .session.active{color:var(--theme-ink-_a0d7b0, var(--lv-success))}', '.lv-login .session.active{color:var(--lv-success)}'),
              ('color:var(--theme-ink-_a8dbb7, var(--lv-success));font-size:11px', 'color:var(--lv-success);font-size:11px'),
              ('.lv-login .trust{text-align:center;color:var(--theme-ink-_7da98a, var(--lv-success));', '.lv-login .trust{text-align:center;color:var(--lv-success);'),
              ('.lv-login .error{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:11px;margin-bottom:13px;border:1px solid var(--theme-line-rgba_239_73_59__28_, var(--lv-brand-border));border-radius:8px;background:var(--lv-brand-soft)}', '.lv-login .error{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:11px;margin-bottom:13px;border:1px solid var(--lv-danger);border-radius:8px;background:var(--lv-danger-soft)}'),
              ('.lv-login .error i{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--lv-brand-primary);', '.lv-login .error i{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--lv-danger-solid);'),
              ('.lv-login .error p{margin:3px 0 0;color:var(--theme-ink-_d3a19c, #d3a19c);', '.lv-login .error p{margin:3px 0 0;color:var(--lv-danger);'),
            ],
            'components/public-header.tsx': [
              ('color: var(--theme-ink-_f4f5f6, #f4f5f6) !important;', 'color: var(--lv-text-on-chrome) !important;'),
              ('.public-header-login:hover {\n    border-color:var(--lv-brand-text);', '.public-header-login:hover {\n    border-color:var(--lv-brand-primary);'),
              ('.public-header-cta:hover { transform: translateY(-1px); filter: brightness(1.08); }', '.public-header-cta:hover { transform: translateY(-1px); background:var(--lv-brand-primary-hover); border-color:var(--lv-brand-primary-hover); filter:none; }'),
              ('.public-menu-button span { display: block; height: 2px; margin: 4px 0; background: var(--theme-bg-white, white); }', '.public-menu-button span { display: block; height: 2px; margin: 4px 0; background: var(--lv-text-on-chrome); }'),
            ],
            'components/public-home.tsx': [
              ('--lv-gold-light: var(--lv-brand-primary);', '--lv-gold-light: var(--lv-brand-text);'),
              ('.lv-btn-gold { border: 1px solid var(--lv-gold-light); background:var(--lv-brand-primary); color:var(--lv-text-on-chrome);', '.lv-btn-gold { border: 1px solid var(--lv-brand-primary); background:var(--lv-brand-primary); color:var(--lv-text-on-chrome);'),
              ('.lv-btn:hover { transform: translateY(-2px); }', '.lv-btn:hover { transform: translateY(-2px); }\n  .lv-btn-gold:hover { background:var(--lv-brand-primary-hover); border-color:var(--lv-brand-primary-hover); }'),
            ],
            'components/contact-map-enhancer.tsx': [
              ('color: #101820 !important;', 'color: var(--lv-text-on-chrome) !important;'),
              ('.lv-location-button:hover { filter: brightness(1.08); transform: translateY(-1px); }', '.lv-location-button:hover { background:var(--lv-brand-primary-hover); border-color:var(--lv-brand-primary-hover); filter:none; transform:translateY(-1px); }'),
            ],
            'components/public-lead-actions.tsx': [
              ('.lv-public-lead-action:hover{transform:translateY(-2px);border-color:var(--lv-brand-border);filter:brightness(1.08)}', '.lv-public-lead-action:hover{transform:translateY(-2px);border-color:var(--lv-brand-primary);filter:none}'),
              ('.lv-enquiry-form input:focus,.lv-enquiry-form select:focus,.lv-enquiry-form textarea:focus{border-color:var(--lv-brand-text);box-shadow:0 0 0 2px var(--lv-brand-soft)}', '.lv-enquiry-form input:focus,.lv-enquiry-form select:focus,.lv-enquiry-form textarea:focus{border-color:var(--lv-brand-primary);box-shadow:0 0 0 3px var(--lv-brand-ring)}'),
              ('.lv-enquiry-services input{width:16px;height:16px;accent-color:var(--lv-brand-text);padding:0}', '.lv-enquiry-services input{width:16px;height:16px;accent-color:var(--lv-brand-primary);padding:0}'),
              ('.lv-enquiry-submit-row button:disabled{opacity:.55}', '.lv-enquiry-submit-row button:hover:not(:disabled){background:var(--lv-brand-primary-hover);border-color:var(--lv-brand-primary-hover)}.lv-enquiry-submit-row button:disabled{opacity:.55}'),
              ('.lv-enquiry-error{padding:10px 12px;border-left:3px solid var(--lv-brand-primary);border-radius:7px;background:var(--lv-brand-soft);color:#ffd2d4;font-size:11px}', '.lv-enquiry-error{padding:10px 12px;border-left:3px solid var(--lv-danger-solid);border-radius:7px;background:var(--lv-danger-soft);color:var(--lv-danger);font-size:11px}'),
              ('.lv-enquiry-success{display:grid;gap:8px;padding:22px;border:1px solid rgba(75,181,95,.45);border-radius:11px;background:rgba(75,181,95,.09)}', '.lv-enquiry-success{display:grid;gap:8px;padding:22px;border:1px solid var(--lv-success);border-radius:11px;background:var(--lv-success-soft)}'),
              ('.lv-enquiry-success span{color:#b7e6c0;font-weight:900}', '.lv-enquiry-success span{color:var(--lv-success);font-weight:900}'),
            ],
            'components/role-portal-shell.tsx': [
              ('border-color:var(--lv-brand-text);box-shadow:0 10px 28px var(--lv-brand-ring)', 'border-color:var(--lv-brand-primary);box-shadow:0 10px 28px var(--lv-brand-ring)'),
              ('.portal-employee .employee-action:hover{border-color:var(--lv-brand-text);background:var(--lv-brand-soft)}', '.portal-employee .employee-action:hover{border-color:var(--lv-brand-primary);background:var(--lv-brand-soft)}'),
              ('border:1px solid rgba(69,200,132,.28);border-radius:9px;background:var(--lv-success-soft);color:var(--lv-success);', 'border:1px solid var(--lv-success);border-radius:9px;background:var(--lv-success-soft);color:var(--lv-success);'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected exactly one occurrence, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
            print(f'{filename}: applied {len(pairs)} intent fixes')
          PY

      - name: Commit intent fixes
        shell: bash
        run: |
          git config user.name "LAND VIEW UI Migration"
          git config user.email "actions@users.noreply.github.com"
          git add app/login/page.tsx components/public-header.tsx components/public-home.tsx components/contact-map-enhancer.tsx components/public-lead-actions.tsx components/role-portal-shell.tsx
          git commit -m "Refine shared token intent for public and portal UI"
          git push origin HEAD:refactor/ui-system-cleanup-phase-2-20261024
